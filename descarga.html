<!DOCTYPE html>
<html lang="es">
<head>
<script>/* si entran por /pagina.html, se muestra y se guarda la dirección limpia /pagina */(function(){var p=location.pathname;if(/\.html$/.test(p)){p=p.replace(/\/index\.html$/,"/").replace(/\.html$/,"");location.replace(p+location.search+location.hash);}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu producto — COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=3">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--az1:#0D2B6B;--az2:#1A4DAA;--ro1:#E02020;--gris:#6B7280;--gcl:#F8F8F6;
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
body{font-family:var(--sans);background:var(--gcl);color:#1a1a2e;min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:18px;padding:40px 36px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 12px 40px rgba(13,43,107,.12)}
.ico{font-size:40px;margin-bottom:14px}
h1{font-family:var(--serif);color:var(--az1);font-size:21px;margin-bottom:10px}
p{color:var(--gris);font-size:14px;line-height:1.6;margin-bottom:22px}
a.dl,button.dl{display:inline-block;background:var(--ro1);color:#fff;text-decoration:none;font-weight:700;
  padding:14px 30px;border-radius:10px;font-size:15px;border:none;cursor:pointer;font-family:inherit}
a.dl:hover,button.dl:hover{background:#FF3535}
button.dl:disabled{background:#cbd5e1;cursor:not-allowed}
.dlmsg{font-size:12.5px;color:var(--gris);margin-top:10px;min-height:16px}
a.back{display:block;margin-top:20px;color:var(--az2);font-size:13px;text-decoration:none}
.err{color:var(--ro1);font-size:14px}
.dls{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.dls .dl{width:100%}
.up{background:#EEF0F3;border:1px solid #E2E5EA;border-radius:12px;padding:16px 18px;margin-top:26px;text-align:left}
.up-t{font-weight:700;color:#6B7280;font-size:14px;margin-bottom:6px}
.up p{font-size:13px;color:#7b8494;margin-bottom:12px}
.up-b{display:inline-block;background:#B8BEC9;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:10px 20px;border-radius:8px}
.up-b:hover{background:#8f97a6}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="ico">⏳</div>
  <p>Cargando tu producto...</p>
</div>

<script>
const CORE_API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const token = localStorage.getItem('ct_token');
const card = document.getElementById('card');

async function init() {
  if (!slug) { mostrarError('Falta indicar qué producto.'); return; }
  if (!token) {
    location.href = '/cursos';
    return;
  }
  try {
    const r = await fetch(`${CORE_API}/producto-simple/${slug}`, {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (r.status === 401) { location.href = '/cursos'; return; }
    if (r.status === 403) { mostrarError('Esta cuenta no compró este producto todavía.'); return; }
    const d = await r.json();
    if (!r.ok) { mostrarError(d.error || 'No pudimos cargar tu producto.'); return; }
    mostrarDescarga(d.titulo, d.archivoUrl, d.archivos, d.ofertaIA);
  } catch (e) {
    mostrarError('Error de conexión. Probá de nuevo en un rato.');
  }
}

function mostrarDescarga(titulo, url, archivos, ofertaIA) {
  const lista = Array.isArray(archivos) && archivos.length ? archivos : null;
  // Producto con varios archivos (ej. la guía + su plantilla): un botón por archivo. La oferta de IA para
  // Emprendedores va abajo, en gris, solo si la cuenta todavía no la tiene.
  const cuerpo = lista
    ? `<div class="dls">${lista.map((et, i) => `<button class="dl dl-n" data-n="${i}">Descargar ${et.charAt(0).toLowerCase() + et.slice(1)} →</button>`).join('')}</div><p class="dlmsg" id="dlMsg"></p>`
    : (url ? `<button class="dl" id="dlBtn">Descargar →</button><p class="dlmsg" id="dlMsg"></p>`
           : `<p class="err">Todavía no se cargó el archivo de este producto — escribinos y te lo mandamos por mail mientras tanto.</p>`);
  const oferta = lista && ofertaIA
    ? `<div class="up"><div class="up-t">IA para Emprendedores</div><p>Ampliá esta base con imágenes, textos de venta, email marketing y una biblioteca de 29 prompts.</p><a class="up-b" href="/iaprincipiantes">Adquirir</a></div>`
    : '';
  card.innerHTML = `
    <div class="ico">🎁</div>
    <h1>${titulo}</h1>
    <p>Tu compra está lista. Podés volver a esta página cuando quieras desde tu cuenta para descargarlo de nuevo.</p>
    ${cuerpo}
    ${oferta}
    <a class="back" href="/cursos">← Volver a mis cursos</a>
  `;
  if (lista) document.querySelectorAll('.dl-n').forEach(b => b.addEventListener('click', () => descargarArchivo(Number(b.dataset.n), b)));
  else if (url) document.getElementById('dlBtn').addEventListener('click', () => descargarArchivo());
}

// Pasa por el endpoint autenticado (no por la URL pública directa): si es
// un PDF liviano, el worker le estampa un identificador invisible con la
// cuenta compradora antes de mandarlo -- sin tocar el contenido visible.
async function descargarArchivo(n, boton) {
  const btn = boton || document.getElementById('dlBtn');
  const msg = document.getElementById('dlMsg');
  btn.disabled = true;
  msg.textContent = 'Preparando tu descarga...';
  try {
    const r = await fetch(`${CORE_API}/producto-simple/${slug}/descargar${Number.isInteger(n) ? '?n=' + n : ''}`, {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (!r.ok) throw new Error('No pudimos descargar el archivo.');
    const disposicion = r.headers.get('Content-Disposition') || '';
    const match = /filename="([^"]+)"/.exec(disposicion);
    const nombreArchivo = match ? match[1] : (slug + '.pdf');
    const blob = await r.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(blobUrl);
    msg.textContent = '';
  } catch (e) {
    msg.textContent = 'Error al descargar. Probá de nuevo en un rato.';
  } finally {
    btn.disabled = false;
  }
}
function mostrarError(msg) {
  card.innerHTML = `<div class="ico">⚠️</div><h1>No pudimos mostrar esto</h1><p class="err">${msg}</p><a class="back" href="/cursos">← Volver a mis cursos</a>`;
}

init();
</script>
</body>
</html>
