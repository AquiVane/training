<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto — COSMART Training</title>
<meta name="description" content="Todos los detalles del curso o e-book antes de comprar — COSMART Training.">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --az1:#0D2B6B;--az2:#1A4DAA;--az3:#3A8FC7;
  --ro1:#E02020;--ro2:#FF3535;--ve1:#16a34a;
  --arena:#F2EDE6;--blanco:#FFFFFF;--gris:#6B7280;--gcl:#F8F8F6;
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--gcl);color:#1a1a2e}
a{color:inherit}

.tienda-header{background:#060f22;padding:16px 20px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.tienda-header .logo{display:flex;align-items:center;gap:8px}
.tienda-header img{height:32px}
.tienda-header .training-txt{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ro1)}
.tienda-header .back{color:rgba(255,255,255,.8);font-size:13px;text-decoration:none}
.tienda-header .back:hover{color:#fff}
.tienda-header .right{display:flex;align-items:center;gap:18px}
.cart-btn{position:relative;background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);
  display:flex;align-items:center;gap:8px;text-decoration:none}
.cart-btn:hover{background:rgba(255,255,255,.22)}
.cart-count{background:var(--ro1);color:#fff;border-radius:99px;font-size:11px;font-weight:800;
  min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px}

.wrap{max-width:1000px;margin:0 auto;padding:40px 20px 80px}
.loading, .notfound{text-align:center;padding:80px 20px;color:var(--gris)}
.notfound a{color:var(--az2);font-weight:700;text-decoration:none}

.pdp{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media(max-width:760px){.pdp{grid-template-columns:1fr;gap:28px}}

.media{background:linear-gradient(135deg,#EAF1FB,#F8F8F6);border-radius:18px;aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #E2E8F0}
.media img{width:100%;height:100%;object-fit:cover}
.media .ph{font-size:64px;opacity:.35}

.info .badge{display:inline-block;background:#EFF6FF;color:var(--az2);font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:99px;margin-bottom:14px;letter-spacing:.02em}
.info h1{font-family:var(--serif);font-size:clamp(1.6rem,3.2vw,2.1rem);color:var(--az1);font-weight:800;
  margin-bottom:14px;line-height:1.25}
.info .desc{color:var(--gris);font-size:15px;line-height:1.7;margin-bottom:18px}
.info .urgency{font-size:12.5px;color:var(--ro1);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}

.variant-select{margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.variant-card{border:1.5px solid #E2E8F0;border-radius:12px;padding:14px 16px;cursor:pointer;
  display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.variant-card:hover{border-color:var(--az3)}
.variant-card.selected{border-color:var(--az2);background:#EFF6FF}
.variant-card .vc-radio{width:18px;height:18px;border-radius:50%;border:2px solid #CBD5E1;flex-shrink:0}
.variant-card.selected .vc-radio{border-color:var(--az2);background:radial-gradient(circle,var(--az2) 0 40%,transparent 45%)}
.variant-card .vc-info{flex:1}
.variant-card .vc-name{font-weight:700;font-size:14px;color:var(--az1)}
.variant-card .vc-desc{font-size:12.5px;color:var(--gris);margin-top:2px}
.variant-card .vc-price{text-align:right;flex-shrink:0}
.variant-card .vc-price .p-ars{display:block;font-weight:800;color:var(--az1);font-size:15px}
.variant-card .vc-price .p-usd{font-size:11px;color:var(--gris)}

.price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.price-row .price{font-family:var(--serif);font-size:32px;font-weight:900;color:var(--az1)}
.price-row .price-tachado{font-size:16px;color:#94a3b8;text-decoration:line-through}
.price-usd{font-size:13px;color:var(--gris);margin-bottom:22px}

.btn-add{background:var(--az2);color:#fff;border:none;border-radius:10px;padding:14px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);width:100%;margin-bottom:10px}
.btn-add:hover{background:var(--az1)}
.btn-add.added{background:var(--ve1)}
.btn-comprar{background:var(--ro1);color:#fff;border:none;border-radius:10px;padding:14px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);width:100%}
.btn-comprar:hover{background:var(--ro2)}
.cart-fb{font-size:12.5px;color:var(--ve1);margin-top:10px;min-height:16px;text-align:center;font-weight:600}

.incluye{margin-top:22px;padding-top:22px;border-top:1px solid #E2E8F0}
.incluye h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--az1);margin-bottom:12px}
.incluye ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.incluye li{font-size:13.5px;color:#374151;display:flex;align-items:flex-start;gap:8px}
.incluye li::before{content:"✓";color:var(--ve1);font-weight:800;flex-shrink:0}

.back-tienda{display:inline-block;margin-top:32px;color:var(--az2);font-size:13.5px;font-weight:600;text-decoration:none}
.back-tienda:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="tienda-header">
  <span class="logo">
    <img src="https://cosmart.com.ar/Logo%20completo%20COSMART.png" alt="COSMART">
    <span class="training-txt">Training</span>
  </span>
  <div class="right">
    <a class="back" href="tienda.html">← Volver a la tienda</a>
    <a class="cart-btn" href="carrito.html">🛒 Carrito <span class="cart-count" id="cartCount">0</span></a>
  </div>
</header>

<div class="wrap" id="wrap">
  <div class="loading" id="loadingState">Cargando producto...</div>
</div>

<footer style="background:#060f22;padding:32px 20px;margin-top:20px;font-family:'DM Sans',sans-serif">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center">
    <div style="color:#64748b;font-size:12px;line-height:1.7">
      COSMART · Contenido digital — programas online y e-books. CUIT 27315338986.<br>
      <a href="mailto:info@cosmart.com.ar" style="color:#3A8FC7">mail</a>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <a href="terminos.html" style="color:#94a3b8;font-size:12px;text-decoration:none">Términos y Condiciones</a>
      <a href="privacidad.html" style="color:#94a3b8;font-size:12px;text-decoration:none">Privacidad</a>
      <a href="devoluciones.html" style="color:#94a3b8;font-size:12px;text-decoration:none">Devoluciones y Arrepentimiento</a>
    </div>
  </div>
</footer>

<script>
// ══════════════════════════════════════════════════════════════
//  producto.html -- página dinámica de un solo producto (PDP).
//  Sirve tanto para los cursos con campus (contenidosrrss,
//  productos-ganadores) como para cualquier e-book creado desde el
//  panel admin (catálogo dinámico, GET /api/productos). Comparte el
//  mismo carrito (localStorage ct_carrito) que tienda.html/carrito.html.
//
//  iaprincipiantes NO usa esta página -- tiene su propia landing rica
//  (iaprincipiantes.html) con temario, FAQ y selector de variante.
// ══════════════════════════════════════════════════════════════

const CORE_API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';

// Copy extendida de los cursos con campus -- mismos datos base que
// tienda.html, con algunos bullets más para la ficha de producto.
const PRODUCTOS_ESTATICOS = {
  'contenidosrrss': {
    slug: 'contenidosrrss',
    badge: '📖 Campus interactivo',
    nombre: 'Estrategia de Contenido 2026/27',
    desc: 'El sistema completo para dejar de improvisar: 31 ideas de contenido listas, formatos validados en Instagram y TikTok, y tu propio asistente de IA armado a medida de tu marca.',
    precio: 17999,
    precioUsd: 14.90,
    urgencia: '🔥 Precio de lanzamiento',
    incluye: [
      'Campus interactivo con 7 módulos',
      '31 ideas de contenido listas para usar',
      'Tu propio asistente de IA armado a medida de tu marca',
      'Certificado al completar el programa',
      'Acceso de por vida, a tu ritmo',
    ],
  },
  'productos-ganadores': {
    slug: 'productos-ganadores',
    badge: '📖 Campus interactivo · Más vendido',
    nombre: 'Cómo Identificar Productos Ganadores',
    desc: 'El sistema que ya usaron cientos de emprendedores para no perder plata en productos que no venden. Incluye el anexo de IA sin costo extra.',
    precio: 45000,
    precioTachado: 65000,
    precioUsd: 32.90,
    precioUsdTachado: 47,
    urgencia: '⚡ 31% OFF por tiempo limitado',
    incluye: [
      'Campus interactivo con 4 módulos',
      'Anexo de IA aplicado a búsqueda de productos, sin costo extra',
      'Certificado al completar el programa',
      'Acceso de por vida, a tu ritmo',
    ],
  },
};

function formatoARS(n) { return '$' + Number(n).toLocaleString('es-AR'); }
function getCarrito() { try { return JSON.parse(localStorage.getItem('ct_carrito') || '[]'); } catch(e) { return []; } }
function setCarrito(items) { localStorage.setItem('ct_carrito', JSON.stringify(items)); actualizarContador(); }
function actualizarContador() { document.getElementById('cartCount').textContent = getCarrito().length; }
actualizarContador();

const params = new URLSearchParams(location.search);
const slug = params.get('slug');
let producto = null; // shape final ya resuelto para render

function notFound() {
  document.getElementById('wrap').innerHTML = `
    <div class="notfound">
      <p>No encontramos este producto (puede que ya no esté a la venta).</p>
      <p style="margin-top:10px"><a href="tienda.html">← Volver a la tienda</a></p>
    </div>`;
}

function render() {
  const wrap = document.getElementById('wrap');
  const media = producto.imagenUrl
    ? `<img src="${producto.imagenUrl}" alt="${producto.nombre}">`
    : `<span class="ph">📖</span>`;
  const incluyeHtml = (producto.incluye && producto.incluye.length)
    ? `<div class="incluye"><h3>Qué incluye</h3><ul>${producto.incluye.map(i => `<li>${i}</li>`).join('')}</ul></div>`
    : '';

  wrap.innerHTML = `
    <div class="pdp">
      <div class="media">${media}</div>
      <div class="info">
        <span class="badge">${producto.badge}</span>
        <h1>${producto.nombre}</h1>
        <p class="desc">${producto.desc}</p>
        ${producto.urgencia ? `<p class="urgency">${producto.urgencia}</p>` : ''}
        <div class="price-row">
          ${producto.precioTachado ? `<span class="price-tachado">${formatoARS(producto.precioTachado)}</span>` : ''}
          <span class="price">${formatoARS(producto.precio)}</span>
        </div>
        <p class="price-usd">${producto.precioUsdTachado ? `<span style="text-decoration:line-through">USD ${producto.precioUsdTachado}</span> ` : ''}USD ${producto.precioUsd}</p>
        <button class="btn-add" id="addBtn">Agregar al carrito</button>
        <button class="btn-comprar" id="buyBtn">Comprar ahora →</button>
        <p class="cart-fb" id="cartFb"></p>
        ${incluyeHtml}
      </div>
    </div>
    <a class="back-tienda" href="tienda.html">← Seguir viendo la tienda</a>
  `;

  document.getElementById('addBtn').addEventListener('click', agregarAlCarrito);
  document.getElementById('buyBtn').addEventListener('click', comprarAhora);
}

function itemDeProducto() {
  return { slug: producto.slug, nombre: producto.nombre, precio: producto.precio, precioUsd: producto.precioUsd };
}
function agregarAlCarrito() {
  const carrito = getCarrito();
  const fb = document.getElementById('cartFb');
  if (carrito.some(i => i.slug === producto.slug)) {
    fb.textContent = 'Ya está en tu carrito.';
    return;
  }
  carrito.push(itemDeProducto());
  setCarrito(carrito);
  fb.textContent = `✓ ${producto.nombre} agregado al carrito`;
}
function comprarAhora() {
  const carrito = getCarrito().filter(i => i.slug !== producto.slug);
  carrito.push(itemDeProducto());
  setCarrito(carrito);
  window.location.href = 'carrito.html';
}

async function init() {
  if (!slug) { notFound(); return; }

  if (PRODUCTOS_ESTATICOS[slug]) {
    producto = PRODUCTOS_ESTATICOS[slug];
    render();
    return;
  }

  try {
    const r = await fetch(`${CORE_API}/api/productos`);
    const d = await r.json();
    const p = (d.productos || []).find(x => x.slug === slug);
    if (!p) { notFound(); return; }
    producto = {
      slug: p.slug, nombre: p.nombre, desc: p.descripcion, badge: p.badge || '📖 E-book',
      urgencia: p.urgencia, precio: p.precio, precioUsd: p.precioUsd,
      precioTachado: p.precioTachado, precioUsdTachado: p.precioUsdTachado,
      imagenUrl: p.imagenUrl, incluye: ['Entrega digital inmediata después de la compra', 'Acceso de por vida desde tu cuenta'],
    };
    render();
  } catch (e) {
    notFound();
  }
}

init();
</script>
</body>
</html>
