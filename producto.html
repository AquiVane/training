<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirigiendo… | COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=2">
</head>
<body>
<p>Esta página se mudó — redirigiendo…</p>
<script>
// producto.html?slug=X se reemplazó por /tienda/X (URLs limpias, ver
// 404.html en la raíz). Este archivo queda solo por compatibilidad con
// links viejos que puedan estar circulando.
var slug = new URLSearchParams(location.search).get('slug');
location.replace(slug ? '/tienda/' + encodeURIComponent(slug) : '/tienda.html');
</script>
</body>
</html>
