<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nueva venta — COSMART Ventas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/images/favicon.ico?v=3">
<link rel="apple-touch-icon" href="/images/favicon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060f22">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#060f22;color:#e2e8f0;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px}
a{color:inherit}
.back{position:fixed;top:18px;left:18px;font-size:13px;color:#94a3b8;text-decoration:none}

/* ── Tarjeta pensada para capturar y publicar ── */
.card{background:linear-gradient(160deg,#0d1f3c,#0a1628);border:1px solid #1e3a6e;border-radius:24px;
  padding:48px 36px;text-align:center;max-width:420px;width:100%}
.card .brand-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px}
.card .brand-row img{height:28px}
.card .brand-row .tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:#E02020;padding:3px 8px;border-radius:5px}
.card .badge{display:inline-block;background:rgba(74,222,128,.12);color:#4ade80;font-size:11.5px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;border-radius:99px;margin-bottom:20px}
.card .titulo{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:18px}
.card .monto{font-size:44px;font-weight:900;color:#4ade80;margin-bottom:8px}
.card .fecha{font-size:12.5px;color:#64748b}
.empty{text-align:center;color:#64748b;font-size:13px}
</style>
</head>
<body>

<a class="back" href="index.html">← Ventas</a>
<div id="cardWrap"><div class="empty">Cargando…</div></div>

<script>
(function () {
  var API = "https://cosmart-training-core.conglomeradocosmart.workers.dev";
  var KEY_STORAGE = "cosmart_admin_secret";
  var wrap = document.getElementById("cardWrap");

  var key = localStorage.getItem(KEY_STORAGE);
  var id = new URLSearchParams(location.search).get("id");

  if (!key) {
    location.href = "index.html";
    return;
  }
  if (!id) {
    wrap.innerHTML = '<div class="empty">Falta el id de la venta.</div>';
    return;
  }

  fetch(API + "/admin/venta/" + encodeURIComponent(id), { headers: { "X-Admin-Key": key } })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function (d) {
      var v = d.venta;
      var monto = v.moneda === "USD" ? ("USD " + v.monto) : ("$" + Number(v.monto).toLocaleString("es-AR"));
      var fecha = new Date(v.fecha).toLocaleString("es-AR", { day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
      wrap.innerHTML =
        '<div class="card">' +
          '<div class="brand-row"><img src="https://cosmart.com.ar/Logo%20completo%20COSMART.png" alt="COSMART"><span class="tag">Training</span></div>' +
          '<div class="badge">🎉 Nueva venta</div>' +
          '<div class="titulo">' + v.titulo + '</div>' +
          '<div class="monto">' + monto + '</div>' +
          '<div class="fecha">' + fecha + '</div>' +
        '</div>';
    })
    .catch(function () { wrap.innerHTML = '<div class="empty">No se pudo cargar esta venta.</div>'; });
})();
</script>
</body>
</html>
