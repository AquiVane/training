    }
    // El mes en el que arranca el rango se rotula solo si queda lugar antes del próximo mes (si no, se pisarían los nombres).
    var primerMes = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)) / 86400000;
    if (primerMes - ini > 14) mHtml = '<div class="g-month" style="left:0">' + MESES[d0.getUTCMonth()] + ' ' + String(d0.getUTCFullYear()).slice(2) + '</div>' + mHtml;
    var hoyHtml = (hoy >= ini && hoy <= fin) ? '<div class="g-today" style="left:' + ((hoy - ini) * DW) + 'px" title="Hoy"></div>' : '';
    var grupos = [];
    if (agrupar === 'persona') {
      var orden = []; all.forEach(function (i) { if (orden.indexOf(i.responsable) < 0) orden.push(i.responsable); });
      grupos = orden.map(function (r) { return { nombre: r, items: all.filter(function (i) { return i.responsable === r; }) }; });
    } else {
      grupos = etapas.map(function (e) { return { nombre: e.nombre, items: all.filter(function (i) { return i.etapa === e.nombre; }) }; }).filter(function (g) { return g.items.length; });
    }
    var rows = '<div class="g-row g-head"><div class="g-label">' + (agrupar === 'persona' ? 'Persona y tarea' : 'Etapa y tarea') + '</div><div class="g-track" style="width:' + w + 'px">' + mHtml + wHtml + hoyHtml + '</div></div>';
    grupos.forEach(function (g) {
      g.items.sort(function (a, b) { return a.inicio.localeCompare(b.inicio) || a.ref.localeCompare(b.ref, undefined, { numeric: true }); });
      var h = g.items.filter(function (i) { return i.done; }).length;
      rows += '<div class="g-row g-grp"><div class="g-label"><span>' + esc(g.nombre) + '</span><span class="cnt">' + h + '/' + g.items.length + '</span></div><div class="g-track" style="width:' + w + 'px"></div></div>';
      g.items.forEach(function (i) {
        var est = estadoItem(i), l = (dia(i.inicio) - ini) * DW, ancho = Math.max((dia(i.fin) - dia(i.inicio) + 1) * DW, 8);
        var tip = i.ref + ' ' + i.tarea + ' · ' + i.responsable + ' · ' + fmt(i.inicio) + (i.fin !== i.inicio ? ' al ' + fmt(i.fin) : '') + (est === 'bloq' ? ' · bloqueado por ' + bloqueos(i).join(', ') : '');
        var marca = i.inicio === i.fin ? '<button type="button" class="g-hito ' + est + '" style="left:' + (l + DW / 2 - 7) + 'px" title="' + esc(tip) + '" aria-label="' + esc(tip) + '"></button>'
          : '<button type="button" class="g-bar ' + est + '" style="left:' + l + 'px;width:' + ancho + 'px" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' + (ancho > 30 ? esc(i.ref) : '') + '</button>';
        rows += '<div class="g-row"><div class="g-label" title="' + esc(i.tarea) + '"><span>' + esc(i.ref + ' ' + i.tarea) + '</span></div><div class="g-track" style="width:' + w + 'px">' + wHtml + hoyHtml + marca + '</div></div>';
      });
    });
    return '<div class="seg" style="margin-top:1rem" role="group" aria-label="Agrupar"><button type="button" data-g="persona" aria-pressed="' + (agrupar === 'persona') + '">Por persona</button><button type="button" data-g="etapa" aria-pressed="' + (agrupar === 'etapa') + '">Por etapa</button></div>' +
      '<div class="gantt-wrap"><div class="gantt">' + rows + '</div></div>' +
      '<div class="legend"><span><i style="background:var(--ok)"></i>Hecho</span><span><i style="background:var(--amber)"></i>En curso</span><span><i style="background:var(--todo)"></i>Pendiente</span><span><i style="background:var(--late)"></i>Vencido</span><span><i style="background:repeating-linear-gradient(45deg,var(--lock),var(--lock) 3px,transparent 3px,transparent 6px)"></i>Bloqueado</span><span><i style="background:var(--late);width:2px"></i>Hoy</span><span>Rombo: hito de un solo día</span></div>';
  }

  function pintar() {
    pintarCabecera();
    $('v-check').setAttribute('aria-pressed', vista === 'check'); $('v-gantt').setAttribute('aria-pressed', vista === 'gantt');
    $('f-todas').setAttribute('aria-pressed', !soloPend); $('f-pend').setAttribute('aria-pressed', soloPend);
    $('main').innerHTML = !etapas.length ? '<div class="vacio">Todavía no hay etapas cargadas. Importá el Excel del plan en Tareas.</div>' : (vista === 'check' ? pintarChecklist() : pintarGantt());
    $('foot').textContent = META.pie || '';
    try { var f = window.frameElement; if (f) f.style.height = document.documentElement.scrollHeight + 'px'; } catch (e) {}
  }

  // ── Tildar ───────────────────────────────────────────────────
  function reemplazar(t) { var i = tareas.findIndex(function (x) { return x.id === t.id; }); if (i > -1) tareas[i] = t; }
  async function tildar(ref, done) {
    var it = porRef[ref]; if (!it) return;
    if (demo) {
      tareas.forEach(function (t) { (t.subtareas || []).forEach(function (s) { if (s.ref === ref) s.done = done; }); });
      armar(); pintar(); return;
    }
    $('estado').textContent = 'Guardando…';
    try {
      var t = await bridge.tildar(it.tareaId, ref, done);
      reemplazar(t); $('estado').textContent = 'Guardado';
    } catch (e) { $('estado').textContent = 'No se pudo guardar. Probá de nuevo.'; }
    armar(); pintar();
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.id === 'v-check') { vista = 'check'; pintar(); }
    else if (b.id === 'v-gantt') { vista = 'gantt'; pintar(); }
    else if (b.id === 'f-todas') { soloPend = false; pintar(); }
    else if (b.id === 'f-pend') { soloPend = true; pintar(); }
    else if (b.hasAttribute('data-r')) { filtroResp = b.getAttribute('data-r'); pintar(); }
    else if (b.hasAttribute('data-g')) { agrupar = b.getAttribute('data-g'); pintar(); }
  });
  document.addEventListener('change', function (ev) {
    var c = ev.target; if (c && c.matches && c.matches('input[type=checkbox][data-ref]')) tildar(c.getAttribute('data-ref'), c.checked);
  });

  async function cargar() {
    if (demo) tareas = JSON.parse(JSON.stringify(DEMO_TAREAS));
    else { try { tareas = await bridge.tareas(); } catch (e) { tareas = []; $('estado').textContent = 'No se pudieron leer las tareas.'; } }
    armar(); pintar();
  }
  window.addEventListener('focus', function () { if (!demo) cargar(); });
  cargar();
})();
</script>

</body></html>
