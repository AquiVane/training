<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elegí tu horario — Tu negocio, tu sistema | COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=3">
<meta name="theme-color" content="#060F22">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--deep:#060F22;--navy:#0D2B6B;--blue:#1A4DAA;--sky:#3A8FC7;--red:#E02020;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:#fff;background:linear-gradient(180deg,#060F22,#0a2257 60%,#060F22);background-color:#060F22;min-height:100vh;line-height:1.5;overflow-x:clip}
.w{width:min(760px,100% - 32px);margin:0 auto;padding:28px 0 60px}
.logo{height:34px;width:auto;margin-bottom:26px}
h1{font:900 clamp(28px,7vw,40px)/1.12 var(--serif);margin-bottom:10px;text-wrap:balance}
.sub{color:rgba(255,255,255,.9);margin-bottom:22px;max-width:560px}
.card{background:linear-gradient(135deg,rgba(13,43,107,.85),rgba(9,28,71,.92));border:1px solid rgba(110,165,255,.3);border-radius:18px;padding:22px}
.estado{text-align:center;padding:40px 22px}
.estado p{margin-top:10px;color:rgba(255,255,255,.9)}
.dias{display:grid;gap:12px;margin-bottom:22px}
@media(min-width:600px){.dias{grid-template-columns:repeat(2,1fr)}}
.dia{border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px;background:rgba(6,15,34,.45)}
.dia strong{display:block;font-size:16px;text-transform:capitalize;margin-bottom:10px}
.turnos{display:flex;gap:8px;flex-wrap:wrap}
.t{flex:1;min-width:110px;font:700 15px var(--sans);padding:12px 10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;cursor:pointer}
.t:hover:not(:disabled){border-color:#fff;background:rgba(255,255,255,.08)}
.t[aria-pressed=true]{background:var(--red);border-color:var(--red)}
.t:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.t small{display:block;font-weight:500;font-size:12px;opacity:.85}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14.5px}
input{width:100%;font:500 16px var(--sans);color:#fff;background:rgba(6,15,34,.6);border:1.5px solid rgba(255,255,255,.4);border-radius:10px;padding:13px 12px}
input:focus{outline:2px solid #fff;outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:14px 26px;border-radius:12px;background:linear-gradient(180deg,#FF3535,#E02020);box-shadow:0 12px 28px -10px rgba(224,32,32,.75);font:800 16px var(--sans);letter-spacing:.02em;text-transform:uppercase;color:#fff;border:0;cursor:pointer;width:100%;margin-top:18px}
@media(min-width:600px){.btn{width:auto;min-width:300px}}
.btn:disabled{opacity:.55;cursor:wait}
.msg{margin-top:12px;font-weight:600;min-height:20px}.msg.er{color:#ffb3b3}
.ok h2{font:900 28px var(--serif);margin-bottom:8px}
.ok .when{font:700 22px var(--sans);margin:14px 0;color:#9fd0f5}
.sel{margin:14px 0 0;color:#9fd0f5;font-weight:700}
.pie{margin-top:26px;font-size:13.5px;color:rgba(255,255,255,.8)}
</style>
</head>
<body>
<main class="w">
  <img class="logo" src="/images/system-operating-ia/logo-cosmart.webp" alt="COSMART Training" width="136" height="34">
  <div id="app"><div class="card estado"><h1 style="font-size:26px">Un momento…</h1><p>Estamos verificando tu compra.</p></div></div>
</main>
<script>
const CORE = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';
const qs = new URLSearchParams(location.search);
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = f => f.split('-').reverse().join('/');
let T = qs.get('t') || '', elegido = null;
try { if (!T) T = sessionStorage.getItem('men_t') || ''; } catch (e) {}
function track(ev, x) { try { const id = localStorage.getItem('ct_session_id') || 'sin-sesion'; fetch(CORE + '/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true, body: JSON.stringify({ session_id: id, event_type: ev, path: location.pathname, slug: 'haz-tu-propio-sistema-para-tu-negocio', ...(x || {}) }) }).catch(() => {}); } catch (e) {} }
function pantalla(h) { app.innerHTML = h; window.scrollTo({ top: 0 }); }
function sinAcceso(extra) {
  pantalla(`<div class="card estado"><h1 style="font-size:26px">${extra || 'Todavía no vemos tu pago confirmado'}</h1><p>Si ya pagaste, revisá tu correo: te enviamos un mail con el botón <strong>«Elegir mi horario»</strong>. Es tu acceso personal y funciona aunque cierres esta página.</p><p>Si pagaste con Mercado Pago y todavía no llegó, esperá unos minutos y recargá esta página.</p></div>`);
}
async function acceso() {
  if (T) return T;
  const pid = qs.get('pid'); if (!pid) return '';
  const emails = [qs.get('e'), qs.get('e2')].filter(x => x && x.includes('@'));
  if (!emails.length) return '';
  for (let i = 0; i < 12; i++) {               // el aviso del pago puede tardar unos segundos
    for (const e of emails) {
      try { const r = await fetch(`${CORE}/mentoria/acceso?pid=${encodeURIComponent(pid)}&email=${encodeURIComponent(e)}`); const d = await r.json(); if (d && d.t) return d.t; } catch (x) {}
    }
    await new Promise(r => setTimeout(r, 2500));
  }
  return '';
}
function confirmada(r) {
  const ics = `${CORE}/mentoria/ics?t=${encodeURIComponent(T)}`;
  pantalla(`<div class="card ok estado"><h2>¡Tu primera sesión está confirmada!</h2><div class="when">${esc(fmt(r.fecha))} · ${esc(r.rango)} hs<br><small style="font-weight:500;font-size:15px">Hora de Argentina (UTC-3) · 90 minutos · online y en vivo</small></div><p>Te enviamos un mail con la confirmación y el evento para tu calendario. El enlace de la videollamada te llega por mail antes de la sesión.</p><a class="btn" href="${ics}" style="text-decoration:none">Agregar a mi calendario</a><p class="pie">Si necesitás cambiar el horario, respondé el mail de confirmación.</p></div>`);
}
function render(d) {
  if (d.reserva) return confirmada(d.reserva);
  const dias = d.slots.filter(x => x.turnos.some(t => t.disponible));
  if (!dias.length) return pantalla('<div class="card estado"><h1 style="font-size:26px">Por ahora no hay horarios libres</h1><p>Escribinos respondiendo el mail de tu compra y coordinamos tu primera sesión.</p></div>');
  pantalla(`<h1>Elegí el día y la hora de tu primera sesión</h1><p class="sub">Tu compra está confirmada. La sesión dura 90 minutos, es online y en vivo. Horarios de Argentina (UTC-3).</p>
  <div class="dias" id="dias">${dias.map(x => `<div class="dia"><strong>${esc(x.dia)} ${esc(fmt(x.fecha))}</strong><div class="turnos">${x.turnos.map(t => `<button type="button" class="t" ${t.disponible ? '' : 'disabled'} data-f="${x.fecha}" data-h="${t.hora}" aria-pressed="false">${t.hora} hs<small>${t.disponible ? 'libre' : 'ocupado'}</small></button>`).join('')}</div></div>`).join('')}</div>
  <div class="card"><div class="sel" id="sel">Elegí un horario arriba.</div>
  <label for="nombre">Tu nombre</label><input id="nombre" autocomplete="name" maxlength="80">
  <label for="tel">Teléfono o WhatsApp (opcional)</label><input id="tel" type="tel" autocomplete="tel" maxlength="40" inputmode="tel">
  <button class="btn" id="ok" type="button">Confirmar mi sesión</button><div class="msg" id="msg" role="status" aria-live="polite"></div></div>`);
  document.querySelectorAll('.t:not(:disabled)').forEach(b => b.onclick = () => {
    document.querySelectorAll('.t').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true');
    elegido = { fecha: b.dataset.f, hora: b.dataset.h }; document.getElementById('sel').textContent = 'Elegiste: ' + fmt(elegido.fecha) + ' a las ' + elegido.hora + ' hs';
  });
  document.getElementById('ok').onclick = reservar;
}
async function reservar() {
  const msg = document.getElementById('msg'), btn = document.getElementById('ok'); msg.className = 'msg'; msg.textContent = '';
  const nombre = document.getElementById('nombre').value.trim();
  if (!elegido) { msg.className = 'msg er'; msg.textContent = 'Elegí primero un día y un horario.'; return; }
  if (!nombre) { msg.className = 'msg er'; msg.textContent = 'Escribí tu nombre.'; document.getElementById('nombre').focus(); return; }
  btn.disabled = true; btn.textContent = 'Reservando…';
  try {
    const r = await fetch(CORE + '/mentoria/reservar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: T, ...elegido, nombre, telefono: document.getElementById('tel').value.trim() }) });
    const d = await r.json();
    if (r.ok && d.reserva) { track('mentoria_reserva', { donde: elegido.fecha + ' ' + elegido.hora }); return confirmada(d.reserva); }
    msg.className = 'msg er'; msg.textContent = (d && d.error) || 'No pudimos reservar. Probá de nuevo.';
    if (r.status === 409) cargar();
  } catch (e) { msg.className = 'msg er'; msg.textContent = 'No pudimos conectar. Probá de nuevo en un momento.'; }
  btn.disabled = false; btn.textContent = 'Confirmar mi sesión';
}
async function cargar() {
  try {
    const r = await fetch(`${CORE}/mentoria/slots?t=${encodeURIComponent(T)}`);
    if (r.status === 403) return sinAcceso('Este acceso no es válido o venció');
    render(await r.json());
  } catch (e) { sinAcceso('No pudimos cargar los horarios'); }
}
(async () => {
  T = await acceso();
  if (!T) return sinAcceso();
  try { sessionStorage.setItem('men_t', T); } catch (e) {}
  track('mentoria_acceso');
  cargar();
})();
</script>
</body>
</html>
