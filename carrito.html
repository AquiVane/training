<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu carrito — COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=3">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="js/checkout-robusto.js?v=20261012c"></script>
<script src="https://sdk.mercadopago.com/js/v2"></script>
<script src="https://www.paypal.com/sdk/js?client-id=AYuQX3JJShvSkgNn0C195h3GEHGiKNtx44X3wd_5PEoBI1iinpysmDzNRqdZ7blNuZvFWIwcwhc9qiOP&currency=USD&intent=capture" data-sdk-integration-source="button-factory"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --az1:#0D2B6B;--az2:#1A4DAA;--az3:#3A8FC7;
  --ro1:#E02020;--ro2:#FF3535;--ve1:#16a34a;
  --blanco:#FFFFFF;--gris:#6B7280;--gcl:#F8F8F6;
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--gcl);color:#1a1a2e}
a{color:inherit}

.tienda-header{background:#060f22;padding:16px 20px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.tienda-header .logo{display:flex;align-items:center;gap:8px}
.tienda-header img{height:32px}
.tienda-header .training-txt{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--ro1);padding:4px 9px;border-radius:6px}
.tienda-header a.back{color:rgba(255,255,255,.8);font-size:13px;text-decoration:none}
.tienda-header a.back:hover{color:#fff}

.page-wrap{max-width:900px;margin:0 auto;padding:36px 20px 80px}
h1{font-family:var(--serif);color:var(--az1);font-size:26px;margin-bottom:24px}

.layout{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
@media(max-width:800px){.layout{grid-template-columns:1fr}}

.panel{background:#fff;border-radius:16px;padding:24px;border:1px solid #E2E8F0}
.panel h2{font-family:var(--serif);font-size:17px;color:var(--az1);margin-bottom:16px}

.cart-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:14px 0;border-bottom:1px solid #F1F5F9}
.cart-item:last-child{border-bottom:none}
.ci-name{font-size:14px;font-weight:700}
.ci-remove{background:none;border:none;color:var(--ro1);font-size:12px;cursor:pointer;
  font-family:var(--sans);text-decoration:underline;margin-top:4px;padding:0}
.ci-price{font-size:14px;font-weight:700;color:var(--az1);white-space:nowrap}

.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;
  padding-top:16px;border-top:2px solid #E2E8F0}
.total-row span:first-child{font-size:14px;color:var(--gris)}
.total-val{font-family:var(--serif);font-size:26px;font-weight:900;color:var(--az1)}

.empty-cart{text-align:center;padding:50px 20px;color:var(--gris)}
.empty-cart a{color:var(--az2);font-weight:700;text-decoration:none}

.pay-tabs{display:flex;gap:8px;margin-bottom:18px}
.pay-tab{flex:1;padding:10px;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:8px;
  font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;color:var(--gris)}
.pay-tab.active{background:var(--az1);color:#fff;border-color:var(--az1)}
#paymentBrick_container{min-height:280px}
#mpmsg,#ppmsg{font-size:13px;text-align:center;margin-top:10px;min-height:18px;font-family:var(--sans)}
#mpAlternativa,#ppAlternativa{margin-top:10px}

.legal-note{font-size:11.5px;color:#94a3b8;margin-top:18px;line-height:1.6}
.consent-row{display:flex;align-items:flex-start;gap:10px;background:#F8FAFC;border:1px solid #E2E8F0;
  border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:12.5px;color:#374151;line-height:1.6;cursor:pointer}
.consent-row input{margin-top:2px;flex-shrink:0;width:16px;height:16px;accent-color:var(--az2)}
.consent-row a{color:var(--az2)}
.pay-block-disabled{position:relative}
.pay-block-disabled .pay-tabs,.pay-block-disabled #mp-section,.pay-block-disabled #pp-section{opacity:.35;pointer-events:none;filter:grayscale(.4)}
.pay-block-hint{display:block;text-align:center;font-size:13px;color:var(--ro1);font-weight:700;margin-top:12px}
.legal-note a{color:var(--az2)}

.upsell-box{margin-top:22px;padding-top:18px;border-top:1px dashed #E2E8F0}
.upsell-box h3{font-size:13px;color:var(--gris);font-weight:700;margin-bottom:12px}
.upsell-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.upsell-item .ui-name{font-size:13px;font-weight:700;color:#1a1a2e}
.upsell-item .ui-price{font-size:12px;color:var(--gris);margin-top:2px}
.upsell-item .ui-btn{background:var(--az2);color:#fff;border:none;border-radius:8px;padding:8px 14px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap;text-decoration:none}
.upsell-item .ui-btn:hover{background:var(--az1)}

.ci-price-old{text-decoration:line-through;color:#94a3b8;font-weight:400;font-size:12px;margin-right:6px}
.codigo-box{margin-top:14px}
.codigo-input-row{display:flex;gap:8px}
.codigo-input-row input{flex:1;padding:10px 12px;border:1px solid #E2E8F0;border-radius:8px;
  font-family:var(--sans);font-size:13px;color:#1a1a2e}
.codigo-input-row input:focus{outline:none;border-color:var(--az2)}
.codigo-input-row button{background:var(--az2);color:#fff;border:none;border-radius:8px;padding:10px 18px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap}
.codigo-input-row button:hover{background:var(--az1)}
.codigo-error{color:var(--ro1);font-size:12px;margin-top:6px}
.codigo-aplicado{background:#F0FDF4;border:1px solid #bbf7d0;color:#166534;border-radius:8px;
  padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.codigo-quitar{background:none;border:none;color:#166534;text-decoration:underline;font-size:12px;
  cursor:pointer;font-family:var(--sans);white-space:nowrap;padding:0}

.ct-email-box{margin-bottom:16px}
.ct-email-box label{font-size:12px;color:var(--gris);display:block;margin-bottom:6px;line-height:1.5}
.ct-email-box input{width:100%;padding:10px 12px;border:1px solid #E2E8F0;border-radius:8px;
  font-family:var(--sans);font-size:13px;box-sizing:border-box}
.ct-email-box input:focus{outline:none;border-color:var(--az2)}
</style>
</head>
<body>

<header class="tienda-header">
  <span class="logo">
    <img src="https://cosmart.com.ar/Logo%20completo%20COSMART.png" alt="COSMART">
    <span class="training-txt">Training</span>
  </span>
  <a class="back" id="seguirComprando" href="tienda.html">← Seguir comprando</a>
</header>

<div class="page-wrap">
  <h1>Tu carrito</h1>
  <div id="cartLayout"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  COSMART Training — Página de carrito con pago embebido
//  El Brick de Mercado Pago y PayPal quedan DENTRO de esta página
//  (no redirige a Mercado Pago) -- usa el mismo carrito de localStorage
//  que arma tienda.html.
// ══════════════════════════════════════════════════════════════

const MP_WORKER = 'https://mp-productos-ganadores.conglomeradocosmart.workers.dev';
const CORE_API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';

// ── Analítica (telemetría anónima, nunca bloquea la navegación) ──
function ctSessionId() {
  try {
    let id = localStorage.getItem('ct_session_id');
    if (!id) { id = crypto.randomUUID(); localStorage.setItem('ct_session_id', id); }
    return id;
  } catch (e) { return 'sin-sesion'; }
}
function ctTrack(event_type, extra) {
  try {
    fetch(`${CORE_API}/track`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ session_id: ctSessionId(), event_type, path: location.pathname, ref: document.referrer || null, ...(extra || {}) }),
    }).catch(() => {});
  } catch (e) {}
}
ctTrack('page_view');

// Vuelve a la tienda de la que vino la persona (tienda.html o
// tienda-v2.html) en vez de mandarla siempre a la original -- si no hay
// nada guardado (llegó directo al carrito) usa tienda.html por defecto.
const TIENDA_ORIGEN = localStorage.getItem('ct_origen_tienda') || 'tienda.html';
document.getElementById('seguirComprando').href = TIENDA_ORIGEN;

function getCarrito() {
  try { return JSON.parse(localStorage.getItem('ct_carrito') || '[]'); }
  catch(e) { return []; }
}
function formatoARS(n) { return '$' + Number(n).toLocaleString('es-AR'); }

// Catálogo simple para el upsell de "¿algo más?" -- mismos datos que
// tienda.html. iaprincipiantes no entra acá (tiene variantes, elige en
// su propia landing page), tampoco cutralco (privado/gratis).
const CATALOGO_UPSELL = [
  { slug: 'contenidosrrss', nombre: 'Estrategia de Contenido 2026/27', precio: 17999, precioUsd: 14.90 },
  { slug: 'productos-ganadores', nombre: 'Cómo Identificar Productos Ganadores', precio: 45000, precioUsd: 32.90 },
];
// Productos creados desde el panel admin -- se suman solos al upsell, así
// un e-book nuevo aparece acá sin tocar código.
let CATALOGO_UPSELL_DINAMICO = [];
async function cargarCatalogoUpsellDinamico() {
  try {
    const r = await fetch(`${CORE_API}/api/productos`);
    const d = await r.json();
    CATALOGO_UPSELL_DINAMICO = (d.productos || []).map(p => ({ slug: p.slug, nombre: p.nombre, precio: p.precio, precioUsd: p.precioUsd }));
  } catch (e) {}
}

const carrito = getCarrito();

// ── Preventa "Marketing + IA de 0 a 100" (ingreso anticipado, 48 h) ──
// El precio y su vencimiento los decide el SERVIDOR (no este navegador): acá solo se refresca lo que se
// muestra. Si la oferta ya venció, el ítem pasa al precio regular del curso (sin el e-book de regalo).
const PREVENTA_SLUG = 'capacitacion-marketing-preventa';
function ctVid() {
  try {
    let v = localStorage.getItem('ct_vid');
    if (!v) { v = crypto.randomUUID(); localStorage.setItem('ct_vid', v); }
    return v;
  } catch (e) { return ''; }
}
let _avisoPreventa = '';
async function refrescarPreventa() {
  const i = carrito.findIndex(x => x.slug === PREVENTA_SLUG);
  if (i < 0) return;
  try {
    const r = await fetch(`${CORE_API}/api/oferta`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ producto: 'preventa-marketing', vid: ctVid(), email: _ctEmail || undefined }) });
    const d = await r.json();
    if (!d || !d.ok) throw new Error('sin respuesta');
    if (d.activa) {
      carrito[i] = { ...carrito[i], precio: d.ars, precioUsd: d.usd };
    } else {
      carrito[i] = { slug: 'capacitacion-marketing', nombre: 'Marketing + IA de 0 a 100', precio: d.listaArs, precioUsd: d.listaUsd };
      _avisoPreventa = 'La oferta de ingreso anticipado finalizó: se aplica el precio regular del curso (sin el e-book de regalo).';
    }
    try { localStorage.setItem('ct_carrito', JSON.stringify(carrito)); } catch (e) {}
  } catch (e) { /* si no responde, el servidor igual cobra el precio vigente al pagar */ }
}
let totalARS = 0;
let totalUSD = 0;

// ── Email obligatorio (pedido de Vaneh 07/09: antes era opcional) ──
// Ahora gatea el pago -- ver actualizarGatePago() -- para que se sepa
// de una si un código de descuento aplica o no ANTES de llegar al
// Brick/PayPal, en vez de descubrirlo recién al pagar. Sigue sin violar
// la regla dura de "nunca sacar a la persona del checkout": no la manda
// a ningún lado, solo no muestra los métodos de pago hasta que lo
// completa, igual que ya pasaba con el checkbox de consentimiento. De
// paso sigue sirviendo para el email de "dejaste algo en tu carrito" si
// no termina de pagar. Se guarda en localStorage para no volver a
// pedirlo si vuelve.
let _ctEmail = '';
try { _ctEmail = localStorage.getItem('ct_email') || ''; } catch (e) {}
let _ctCheckoutStartSent = false;

function ctEmailValido(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

function ctIntentarCheckoutStart() {
  if (_ctCheckoutStartSent || !carrito.length || !ctEmailValido(_ctEmail)) return;
  _ctCheckoutStartSent = true;
  const primero = carrito[0];
  ctTrack('checkout_start', { slug: primero.slug, titulo: primero.nombre, monto: totalARS, moneda: 'ARS', email: _ctEmail });
}

function ctGuardarEmail() {
  const v = (document.getElementById('ctEmail')?.value || '').trim();
  const cambio = v !== _ctEmail;
  _ctEmail = v;
  try { if (v) localStorage.setItem('ct_email', v); } catch (e) {}
  ctIntentarCheckoutStart();
  actualizarGatePago();
  // Los códigos de "primera compra" (ej. EMBARQUE10) se aplican antes de
  // saber el email real -- apenas lo tenemos, hay que revalidar. Recarga
  // la página (mismo patrón que aplicarCodigo()/quitarCodigo()): al
  // volver a correr resolverCodigoPendiente() ya manda el email y, si
  // esta persona ya compró algo antes, el código se cae solo mostrando
  // el mensaje de error en vez de quedar aplicado sin haberlo chequeado.
  if (cambio && _codigoAplicado && _codigoAplicado.primeraCompraSolo && ctEmailValido(v)) {
    window.location.reload();
  }
}

// ── CÓDIGOS DE DESCUENTO ────────────────────────────────────────
// Un código aplica a UN curso puntual (mismo mecanismo que ya usa
// contenidosrrss.html para su propia landing) -- acá se busca en el
// carrito el ítem cuyo slug coincide con el courseId del código y
// se le descuenta solo a ese ítem, no al total entero.
let _codigoAplicado = null; // { codigo, courseId, descuentoPct }
let _codigoError = null;
let _codigoTexto = '';

function leerCodigoPendiente() {
  const deUrl = (new URLSearchParams(location.search).get('codigo') || '').toUpperCase().trim();
  if (deUrl) return deUrl;
  try { return (localStorage.getItem('ct_codigo') || '').toUpperCase().trim(); }
  catch (e) { return ''; }
}

async function resolverCodigoPendiente() {
  _codigoTexto = leerCodigoPendiente();
  if (!_codigoTexto) return;
  try {
    // Si ya tenemos el email (volvió a esta página, o lo completó antes de
    // que se reloadeara al aplicar/cambiar el código) lo mandamos así el
    // backend puede validar de una los códigos de "primera compra" --
    // courseId:'ALL' es el único caso especial: significa "descontá todos
    // los ítems del carrito", no un curso puntual como el resto.
    const r = await fetch(`${CORE_API}/api/codigo?c=${encodeURIComponent(_codigoTexto)}${_ctEmail ? `&email=${encodeURIComponent(_ctEmail)}` : ''}`);
    if (!r.ok) throw new Error('inválido');
    const data = await r.json();
    if (!data.activo || data.tipo !== 'discount' || !data.descuentoPct) throw new Error('no aplicable');
    if (data.courseId !== 'ALL' && !carrito.some(i => i.slug === data.courseId)) throw new Error('no está en el carrito');
    if (data.elegible === false) throw new Error('primera_compra');
    _codigoAplicado = { codigo: _codigoTexto, courseId: data.courseId, descuentoPct: data.descuentoPct, primeraCompraSolo: !!data.primeraCompraSolo };
    // Se re-guarda (no se borra) para que sobreviva a un reload disparado
    // por "Quitar"/"Agregar" un ítem del carrito -- solo se borra cuando
    // la persona lo saca a mano (quitarCodigo) o al confirmar la compra.
    try { localStorage.setItem('ct_codigo', _codigoTexto); } catch (e) {}
  } catch (e) {
    _codigoError = e.message === 'primera_compra'
      ? `El código "${_codigoTexto}" es válido solo para tu primera compra — ya vemos una compra anterior con este email.`
      : `El código "${_codigoTexto}" no es válido o no aplica a lo que tenés en el carrito.`;
    try { localStorage.removeItem('ct_codigo'); } catch (e) {}
  }
}

function codigoAplicaA(slug) {
  return !!_codigoAplicado && (_codigoAplicado.courseId === 'ALL' || _codigoAplicado.courseId === slug);
}
function precioItem(i) {
  if (codigoAplicaA(i.slug)) {
    return Math.round(i.precio * (1 - _codigoAplicado.descuentoPct / 100));
  }
  return i.precio;
}
function precioItemUsd(i) {
  if (codigoAplicaA(i.slug)) {
    return +((i.precioUsd || 0) * (1 - _codigoAplicado.descuentoPct / 100)).toFixed(2);
  }
  return i.precioUsd || 0;
}
function calcularTotales() {
  totalARS = carrito.reduce((s, i) => s + precioItem(i), 0);
  totalUSD = carrito.reduce((s, i) => s + precioItemUsd(i), 0);
}

// Aplicar/quitar código dispara un reload en vez de un segundo render()
// -- mismo patrón que quitar()/agregarUpsell() en este archivo, necesario
// porque un segundo render() después de que el Brick ya montó rompe todo
// (ver comentario grande más abajo).
function aplicarCodigo() {
  const v = (document.getElementById('codigoInput')?.value || '').trim();
  if (!v) return;
  try { localStorage.setItem('ct_codigo', v.toUpperCase()); } catch (e) {}
  window.location.reload();
}
function quitarCodigo() {
  try { localStorage.removeItem('ct_codigo'); } catch (e) {}
  window.location.href = window.location.pathname;
}

function render() {
  const el = document.getElementById('cartLayout');
  if (!carrito.length) {
    el.innerHTML = `<div class="panel"><div class="empty-cart">
      Tu carrito está vacío.<br><br>
      <a href="${TIENDA_ORIGEN}">Ver los programas disponibles →</a>
    </div></div>`;
    return;
  }

  el.innerHTML = `
    <div class="layout">
      <div class="panel">
        <h2>Resumen (${carrito.length} ${carrito.length === 1 ? 'ítem' : 'ítems'})</h2>
        ${_avisoPreventa ? `<p class="codigo-error" style="margin:0 0 10px">${_avisoPreventa}</p>` : ''}
        ${carrito.map(i => {
          const conDescuento = codigoAplicaA(i.slug);
          return `
          <div class="cart-item">
            <div>
              <div class="ci-name">${i.nombre}</div>
              <button class="ci-remove" onclick="quitar('${i.slug}')">Quitar</button>
            </div>
            <div class="ci-price">${conDescuento ? `<span class="ci-price-old">${formatoARS(i.precio)}</span>` : ''}${formatoARS(precioItem(i))}</div>
          </div>
        `; }).join('')}
        <div class="codigo-box">
          ${_codigoAplicado ? `
            <div class="codigo-aplicado">
              <span>✅ Código <strong>${_codigoAplicado.codigo}</strong> aplicado — ${_codigoAplicado.descuentoPct}% OFF</span>
              <button type="button" class="codigo-quitar" onclick="quitarCodigo()">Quitar</button>
            </div>
          ` : `
            <div class="codigo-input-row">
              <input type="text" id="codigoInput" placeholder="Código de descuento" value="${_codigoTexto || ''}" onkeydown="if(event.key==='Enter')aplicarCodigo()">
              <button type="button" onclick="aplicarCodigo()">Aplicar</button>
            </div>
            ${_codigoError ? `<p class="codigo-error">${_codigoError}</p>` : ''}
          `}
        </div>
        <div class="total-row">
          <span>Total</span>
          <span class="total-val">${formatoARS(totalARS)}</span>
        </div>
        <p style="font-size:12px;color:#94a3b8;margin-top:4px">USD ${totalUSD.toFixed(2)} aprox. si pagás con PayPal</p>
        <p class="legal-note">
          Al confirmar la compra aceptás los <a href="terminos.html">Términos y Condiciones</a> y la
          <a href="privacidad.html">Política de Privacidad</a>. Contenido digital: el acceso se habilita
          apenas se acredita el pago — ver <a href="devoluciones.html">Política de Devoluciones</a> y tu
          derecho de arrepentimiento.
        </p>
        ${carrito.some(i => i.slug === PREVENTA_SLUG) ? '' : renderUpsell()}
      </div>

      <div class="panel">
        <h2>Pagar</h2>
        <div class="ct-email-box">
          <label for="ctEmail">Tu email — lo necesitamos para completar la compra y para validar tu código de descuento, si tenés uno.</label>
          <input type="email" id="ctEmail" required placeholder="tu@email.com" value="${_ctEmail}" oninput="actualizarGatePago()" onchange="ctGuardarEmail()" onblur="ctGuardarEmail()">
        </div>
        <label class="consent-row">
          <input type="checkbox" id="consentCheck" checked onchange="actualizarGatePago()">
          <span>Entiendo que esto es <strong>contenido digital</strong>: una vez que acceda a mi cuenta, pierdo el derecho de arrepentimiento de 10 días. Solo puedo cancelar sin costo si todavía no accedí, dentro de los primeros 10 minutos de la compra. Ver <a href="devoluciones.html" target="_blank">Política de Devoluciones</a>.</span>
        </label>
        <div id="payBlock">
          <div class="pay-tabs">
            <button class="pay-tab active" id="tab-mp" onclick="switchTab('mp')">Pesos (ARS) — Mercado Pago</button>
            <button class="pay-tab" id="tab-pp" onclick="switchTab('pp')">Dólares (USD) — PayPal</button>
          </div>
          <div id="mp-section">
            <div id="paymentBrick_container"></div>
            <div id="mpAlternativa"></div>
            <div id="mpmsg"></div>
          </div>
          <div id="pp-section" style="display:none">
            <div id="paypal_container" style="min-height:150px"></div>
            <div id="ppAlternativa"></div>
            <div id="ppmsg"></div>
          </div>
          <p class="pay-block-hint" id="payBlockHint"></p>
        </div>
      </div>
    </div>
  `;
}

// Upsell "¿te gustaría agregar algo más?" -- solo productos que no estén
// ya en el carrito. Agregar no dispara el pago, solo suma y vuelve a
// renderizar todo (carrito + upsell + Brick se reinician limpios).
function renderUpsell() {
  const enCarrito = new Set(carrito.map(i => i.slug));
  const vistos = new Set();
  const sugeridos = [...CATALOGO_UPSELL, ...CATALOGO_UPSELL_DINAMICO]
    .filter(p => !enCarrito.has(p.slug) && !vistos.has(p.slug) && vistos.add(p.slug));
  if (!sugeridos.length) return '';
  return `
    <div class="upsell-box">
      <h3>¿Le sumás algo más a tu compra?</h3>
      ${sugeridos.map(p => `
        <div class="upsell-item">
          <div>
            <div class="ui-name">${p.nombre}</div>
            <div class="ui-price">${formatoARS(p.precio)} · USD ${p.precioUsd}</div>
          </div>
          <button class="ui-btn" onclick="agregarUpsell('${p.slug}')">Agregar</button>
        </div>
      `).join('')}
      <div class="upsell-item" style="background:#FFFBEB;border-color:#fde68a">
        <div>
          <div class="ui-name">IA para Emprendedores</div>
          <div class="ui-price">Desde $79.990 · USD 54 — e-book o campus completo</div>
        </div>
        <a class="ui-btn" href="/tienda/iaprincipiantes" style="background:#b45309">Ver opciones</a>
      </div>
    </div>`;
}
function agregarUpsell(slug) {
  const p = [...CATALOGO_UPSELL, ...CATALOGO_UPSELL_DINAMICO].find(x => x.slug === slug);
  if (!p || carrito.some(i => i.slug === slug)) return;
  carrito.push({ slug: p.slug, nombre: p.nombre, precio: p.precio, precioUsd: p.precioUsd });
  localStorage.setItem('ct_carrito', JSON.stringify(carrito));
  window.location.reload();
}

// Ojo: render() arma de nuevo el HTML del carrito, incluido el contenedor
// del Brick de Mercado Pago y el botón de PayPal -- si se llamara una
// segunda vez después de que esos SDKs ya montaron ahí, los rompería. Por
// eso se espera el catálogo dinámico ANTES del único render(), no después.
//
// Bug real que causaba "no aparece el checkbox de contenido digital
// tildado" y "no aparece ni Mercado Pago ni PayPal": este init (que
// pone el estado inicial del checkbox y le da el elemento real al
// observer del Brick) se llamaba ANTES de que render() terminara de
// insertar el HTML del carrito (render() espera un fetch async al
// catálogo). document.getElementById devolvía null, tiraba un error
// silencioso y el resto de la página quedaba con el estado por
// defecto: el hint "marcá la casilla" visible para siempre y el Brick
// sin nadie que lo dispare. Se arregla llamando todo esto DESPUÉS de
// que render() ya insertó el HTML, no en paralelo.
Promise.all([cargarCatalogoUpsellDinamico(), resolverCodigoPendiente(), refrescarPreventa()]).then(() => {
  calcularTotales();
  render();
  if (carrito.length) {
    actualizarGatePago();
        ctIntentarCheckoutStart();
  }
});

function actualizarGatePago() {
  const checked = document.getElementById('consentCheck').checked;
  const emailOk = ctEmailValido((document.getElementById('ctEmail')?.value || '').trim());
  const block = document.getElementById('payBlock');
  const hint = document.getElementById('payBlockHint');
  block.classList.toggle('pay-block-disabled', !(checked && emailOk));
  if (!emailOk) {
    hint.textContent = '☝️ Completá tu email arriba para habilitar el pago.';
    hint.style.display = 'block';
  } else if (!checked) {
    hint.textContent = '☝️ Marcá la casilla de arriba para habilitar el pago.';
    hint.style.display = 'block';
  } else {
    hint.style.display = 'none';
  }
  if (checked && emailOk && carrito.length && (document.getElementById('ctEmail').value || '').trim() === _ctEmail) initBrick();
}

function quitar(slug) {
  const nuevo = carrito.filter(i => i.slug !== slug);
  localStorage.setItem('ct_carrito', JSON.stringify(nuevo));
  window.location.reload();
}

function switchTab(tab) {
  document.getElementById('tab-mp').classList.toggle('active', tab === 'mp');
  document.getElementById('tab-pp').classList.toggle('active', tab === 'pp');
  document.getElementById('mp-section').style.display = tab === 'mp' ? 'block' : 'none';
  document.getElementById('pp-section').style.display = tab === 'pp' ? 'block' : 'none';
  if (tab === 'pp') initPayPal();
}

// ── MERCADO PAGO BRICK ────────────────────────────────────────
// Robusto (Safari incluido): js/checkout-robusto.js reintenta solo, recarga el
// SDK si no cargó, reinicia al volver de bfcache/red/pestaña y recién después
// de agotar los intentos muestra "Reintentar". Regla dura: nunca se sale del checkout.
let brickEmail = null;
const brickMP = CTPago.brick({
  contenedor: 'paymentBrick_container', alt: 'mpAlternativa',
  crear: () => new Promise(async (resolve, reject) => {
    const msg = document.getElementById('mpmsg');
    try {
      let json = {}, preference_id = null;
      if (CTPago.modo() === 'pref') { // los modos de respaldo no necesitan preferencia
      const ctrl = new AbortController();
      const tmo = setTimeout(() => ctrl.abort(), 15000);
      const r = await fetch(`${MP_WORKER}/preference`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: carrito.map(i => ({ producto: i.slug, amount: precioItem(i) })),
          vid: ctVid(), lead_email: _ctEmail || undefined,
          event_source_url: window.location.href,
        }),
        signal: ctrl.signal,
      });
      clearTimeout(tmo);
      json = await r.json();
      preference_id = json.preference_id;
      if (!preference_id) throw new Error('No preference_id');
      }

      const mp = CTPago.adaptar(new MercadoPago('APP_USR-057d290b-5af9-4b00-8a08-6753dc47aec4', { locale: 'es-AR' }));
      let controller = null;
      controller = await mp.bricks().create('payment', 'paymentBrick_container', {
        initialization: { amount: totalARS, preferenceId: preference_id },
        customization: {
          visual: { hideFormTitle: true, style: { theme: 'default' } },
          paymentMethods: { creditCard: 'all', debitCard: 'all' },
        },
        callbacks: {
          onReady: () => resolve(controller || { unmount() {} }),
          onSubmit: ({ formData }) => new Promise(async (res2, rej2) => {
            try {
              const pr = await fetch(`${MP_WORKER}/pay`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...formData, items: carrito.map(i => ({ producto: i.slug, amount: precioItem(i) })), vid: ctVid(), lead_email: _ctEmail || undefined }),
              });
              const data = await pr.json();
              if (data.status === 'approved') {
                msg.style.color = '#16a34a';
                msg.innerHTML = '✅ ¡Pago aprobado! Te enviamos un email por cada programa para crear tu usuario y acceder.';
                document.getElementById('paymentBrick_container').style.display = 'none';
                localStorage.removeItem('ct_carrito');
                localStorage.removeItem('ct_codigo');
                setTimeout(() => { window.location.href = 'gracias-tienda.html'; }, 2500);
              } else if (data.status === 'in_process' || data.status === 'pending') {
                msg.style.color = '#F59E0B';
                msg.textContent = '⏳ Pago en proceso. Te avisamos por email cuando se confirme.';
              } else {
                msg.style.color = '#E02020';
                msg.textContent = '⚠️ No se pudo procesar el pago. Revisá los datos e intentá de nuevo.';
              }
              res2();
            } catch(e) { msg.style.color = '#E02020'; msg.textContent = 'Error de conexión. Intentá de nuevo.'; rej2(); }
          }),
          onError: (e) => console.error(e),
        },
      });
    } catch(e) { reject(e); }
  }),
});
// El Brick se monta recién cuando el pago está habilitado (email válido + casilla),
// y se rearma si cambia el email (la preferencia/precio depende de él).
function initBrick() {
  const email = (_ctEmail || '').trim();
  if (brickMP.estado() === 'listo' && brickEmail !== email) { brickEmail = email; return brickMP.reiniciar(); }
  brickEmail = email;
  return brickMP.iniciar();
}

// ── PAYPAL (USD) ──────────────────────────────────────────────
// A diferencia de Mercado Pago, PayPal cobra el total en un solo cargo,
// pero el otorgamiento de acceso se hace con una llamada por curso al
// worker core (mismo mecanismo que ya usan las páginas individuales).
let ppInitialized = false;
function initPayPal() {
  if (ppInitialized || !carrito.length) return;
  CTPago._ppReintento = () => { ppInitialized = false; initPayPal(); };
  ppInitialized = true;
  CTPago.paypal({ alt: 'ppAlternativa', montar: montarPayPal }).then(ok => { if (!ok) ppInitialized = false; });
}
function montarPayPal() {
  return new Promise((resolve, reject) => { try {
  paypal.Buttons({
    style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'pay', height: 48 },
    createOrder: function(data, actions) {
      return actions.order.create({
        purchase_units: [{
          description: 'COSMART Training — ' + carrito.map(i => i.nombre).join(' + '),
          amount: { value: totalUSD.toFixed(2), currency_code: 'USD' },
        }],
      });
    },
    onApprove: function(data, actions) {
      const msg = document.getElementById('ppmsg');
      if (msg) { msg.style.color = '#60a5fa'; msg.textContent = '⏳ Procesando pago...'; }
      return actions.order.capture().then(async function(details) {
        const email = details.payer?.email_address;
        if (email) {
          // Best-effort por item: si uno falla, no bloquea el resto -- misma
          // filosofia que el otorgamiento del lado de Mercado Pago.
          for (const item of carrito) {
            try {
              await fetch(`${CORE_API}/payment/paypal`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, orderID: data.orderID, courseId: item.slug, vid: ctVid(), leadEmail: _ctEmail || undefined }),
              });
            } catch(e) {}
          }
        }
        localStorage.removeItem('ct_carrito');
        localStorage.removeItem('ct_codigo');
        window.location.href = 'gracias-tienda.html';
      });
    },
    onError: function() {
      const msg = document.getElementById('ppmsg');
      if (msg) { msg.style.color = '#E02020'; msg.textContent = '⚠️ Error al procesar el pago. Intentá de nuevo.'; }
      ppInitialized = false;
    },
    onCancel: function() {},
  }).render('#paypal_container').then(resolve, reject);
  } catch(e) { reject(e); } });
}
</script>
