<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COSMART Training — Recuperar contraseña</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://training.cosmart.com.ar/cursos/reset-password">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png?v=2">
<link rel="icon" type="image/png" sizes="128x128" href="/images/favicon-128.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="/images/favicon-512.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon-180.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #091C47; --dark: #060f22; --red: #E3000F; --red-hover: #c40000;
  }
  body {
    font-family: 'Inter', sans-serif; background: var(--dark); color: #fff;
    min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px;
  }
  .card {
    background: #fff; color: var(--dark); border-radius: 16px; padding: 40px;
    width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .logo-wrap { text-align:center; margin-bottom: 24px; }
  .logo-wrap img { height: 30px; width: auto; }
  .logo-badge-sm { display:inline-block; background: var(--red); color:#fff; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:4px; margin-left:6px; vertical-align:middle; }
  h2 { color: var(--navy); font-size: 20px; margin-bottom: 6px; text-align:center; }
  .sub { color: #64748b; font-size: 13px; text-align:center; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:5px; }
  .field input {
    width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:11px 14px; font-size:15px;
    outline:none; transition:border-color .2s; font-family:'Inter',sans-serif;
  }
  .field input:focus { border-color: var(--navy); }
  .btn {
    width:100%; background:var(--red); color:#fff; border:none; border-radius:8px; padding:14px;
    font-size:16px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:background .2s;
  }
  .btn:hover { background: var(--red-hover); }
  .btn:disabled { background:#94a3b8; cursor:not-allowed; }
  .msg-error, .msg-ok { border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; display:none; }
  .msg-error { background:#fef2f2; border:1px solid #fecaca; color:#dc2626; }
  .msg-ok { background:#f0fdf4; border:1px solid #bbf7d0; color:#16a34a; }
  .links { text-align:center; margin-top:18px; font-size:13px; color:#64748b; }
  .links a { color: var(--navy); text-decoration:none; font-weight:600; }
  .links a:hover { text-decoration:underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img src="https://cosmart.com.ar/Logo%20completo%20COSMART.png" alt="COSMART">
    <span class="logo-badge-sm">Training</span>
  </div>

  <!-- Paso 1: pedir el link (sin token en la URL) -->
  <div id="pasoPedir">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="sub">Ingresá tu email y te mandamos un link para restablecerla.</p>
    <div class="msg-error" id="err1"></div>
    <div class="msg-ok" id="ok1"></div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
    </div>
    <button class="btn" id="btnPedir">Enviar link →</button>
    <div class="links"><a href="https://training.cosmart.com.ar/cursos">← Volver a iniciar sesión</a></div>
  </div>

  <!-- Paso 2: definir nueva contraseña (con token en la URL) -->
  <div id="pasoNueva" style="display:none">
    <h2>Elegí tu nueva contraseña</h2>
    <p class="sub">Escribila una vez y listo.</p>
    <div class="msg-error" id="err2"></div>
    <div class="msg-ok" id="ok2"></div>
    <div class="field">
      <label for="pass1">Nueva contraseña</label>
      <input type="password" id="pass1" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="pass2">Repetila</label>
      <input type="password" id="pass2" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn" id="btnNueva">Guardar contraseña →</button>
    <div class="links"><a href="https://training.cosmart.com.ar/cursos">← Volver a iniciar sesión</a></div>
  </div>
</div>

<script>
const API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';
const params = new URLSearchParams(location.search);
const token = params.get('token');

function showErr(id, msg){ const e=document.getElementById(id); e.textContent=msg; e.style.display='block'; }
function showOk(id, msg){ const e=document.getElementById(id); e.textContent=msg; e.style.display='block'; }

if (token) {
  document.getElementById('pasoPedir').style.display = 'none';
  document.getElementById('pasoNueva').style.display = 'block';
}

document.getElementById('btnPedir').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) { showErr('err1', 'Ingresá tu email'); return; }
  const btn = document.getElementById('btnPedir');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const r = await fetch(`${API}/auth/forgot`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    if (!r.ok) { showErr('err1', d.error || 'Error al enviar el link'); return; }
    showOk('ok1', 'Si el email tiene cuenta, te llega el link en unos minutos.');
  } catch (e) {
    showErr('err1', 'Error de conexión. Intentá de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar link →';
  }
});

document.getElementById('btnNueva').addEventListener('click', async () => {
  const pass1 = document.getElementById('pass1').value;
  const pass2 = document.getElementById('pass2').value;
  if (!pass1 || pass1.length < 6) { showErr('err2', 'La contraseña debe tener al menos 6 caracteres'); return; }
  if (pass1 !== pass2) { showErr('err2', 'Las contraseñas no coinciden'); return; }

  const btn = document.getElementById('btnNueva');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const r = await fetch(`${API}/auth/reset`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, newPassword: pass1 })
    });
    const d = await r.json();
    if (!r.ok) { showErr('err2', d.error || 'Error al actualizar la contraseña'); return; }
    showOk('ok2', '¡Listo! Redirigiendo al login...');
    setTimeout(() => location.href = 'https://training.cosmart.com.ar/cursos', 1200);
  } catch (e) {
    showErr('err2', 'Error de conexión. Intentá de nuevo.');
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar contraseña →';
  }
});
</script>

</body>
</html>
