<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing + IA de 0 a 100 — Plataforma | COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--az1:#0D2B6B;--az2:#1A4DAA;--az3:#3A8FC7;--ro:#E02020;--ro2:#FF3535;--bg:#060F22;--card:#0A1638;--marfil:#F8F8F6;--txt:#E8ECF7;--txt2:#A9B4D3;--ink:#1a1f36;--ink2:#4a5270;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--az3);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:10px}
.top img{height:24px;width:auto;filter:brightness(1.4)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--ro);padding:4px 9px;border-radius:6px}
.salir{margin-left:auto;background:none;border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:8px 14px;font:600 13px var(--sans);cursor:pointer;min-height:40px}
.salir:hover{border-color:#fff}
header.h{padding:40px 0 28px}
.eyebrow{color:#8fc3ec;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
h1{font-family:var(--serif);font-weight:900;color:#fff;font-size:clamp(1.8rem,4.4vw,2.6rem);line-height:1.15;margin:8px 0 8px;text-wrap:balance}
.sub{color:var(--txt);max-width:56ch}
section.az{background:var(--az1);padding:44px 0}
section.mf{background:var(--marfil);color:var(--ink);padding:44px 0}
h2{font-family:var(--serif);font-weight:900;font-size:clamp(1.4rem,3vw,1.9rem);margin-bottom:18px}
.az h2{color:#fff}.mf h2{color:var(--az1)}
.clase{background:var(--bg);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:20px;margin-bottom:16px}
.clase .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8fc3ec}
.clase h3{font-family:var(--serif);color:#fff;font-size:1.3rem;margin:2px 0 6px}
.clase p{color:var(--txt);font-size:16px;max-width:60ch}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-top:14px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pronto{margin-top:12px;font-size:14px;color:var(--txt2)}
.mat{list-style:none;display:grid;gap:12px}
.mat li{background:#fff;border:1px solid #e3e5ee;border-radius:12px;padding:16px 18px}
.mat strong{display:block;color:var(--az1);font-size:17px}
.mat span{display:block;color:var(--ink2);font-size:15.5px}
.mat a{display:inline-block;margin-top:8px;color:#fff;background:var(--ro);text-decoration:none;font-weight:700;border-radius:8px;padding:10px 16px;font-size:14px}
.vacio{color:var(--ink2);font-size:16.5px;max-width:60ch}
.estado{padding:60px 0;text-align:center}
.estado h2{color:#fff}
.btn{display:inline-block;background:var(--ro);color:#fff;text-decoration:none;font-weight:700;border-radius:8px;padding:15px 28px;min-height:50px}
footer{background:var(--bg);color:var(--txt2);padding:28px 0;font-size:13px;border-top:1px solid rgba(255,255,255,.08);text-align:center}
footer nav{margin-top:8px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}footer nav a{color:#c8d1ec}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <img src="https://cosmart.com.ar/Logo%20completo%20COSMART.png" alt="COSMART" width="120" height="24"><span class="badge">Training</span>
  <button class="salir" id="salir" type="button" hidden>Salir</button>
</div></div>

<main id="app">
  <div class="wrap estado"><p>Cargando tu plataforma…</p></div>
</main>

<footer><div class="wrap">COSMART Training · Tu brújula digital.<nav><a href="/privacidad">Política de privacidad</a><a href="/terminos">Términos y condiciones</a></nav></div></footer>

<script>
const CORE_API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';
const SLUG = 'capacitacion-marketing';
const LOGIN_URL = 'https://training.cosmart.com.ar/cursos';
const app = document.getElementById('app');
let token = '', nombre = '';
try { token = localStorage.getItem('ct_token') || ''; nombre = localStorage.getItem('ct_nombre') || ''; } catch (e) {}
if (!token) { location.href = LOGIN_URL; }

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function ytId(u) { const m = String(u || '').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : ''; }
function safeUrl(u) { try { const x = new URL(u, location.origin); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } }

function estado(titulo, texto, extra) {
  app.innerHTML = '<div class="wrap estado"><h2>' + esc(titulo) + '</h2><p style="margin-bottom:20px;color:#E8ECF7">' + esc(texto) + '</p>' + (extra || '') + '</div>';
}
function render(d) {
  const clases = (d.clases || []).map(c => {
    const id = ytId(c.videoUrl);
    return '<article class="clase"><span class="k">Clase ' + esc(c.n) + '</span><h3>' + esc(c.titulo) + '</h3>' +
      (c.descripcion ? '<p>' + esc(c.descripcion) + '</p>' : '') +
      (id ? '<div class="video"><iframe src="https://www.youtube.com/embed/' + id + '?rel=0&modestbranding=1" title="Clase ' + esc(c.n) + ': ' + esc(c.titulo) + '" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>'
           : '<p class="pronto">La grabación aparece acá después de la clase en vivo.</p>') + '</article>';
  }).join('');
  const mat = (d.material || []).map(m => {
    const u = safeUrl(m.url);
    return '<li><strong>' + esc(m.titulo) + '</strong>' + (m.descripcion ? '<span>' + esc(m.descripcion) + '</span>' : '') + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">Abrir</a>' : '') + '</li>';
  }).join('');
  app.innerHTML =
    '<header class="h"><div class="wrap"><span class="eyebrow">Plataforma del intensivo</span><h1>' + esc(d.titulo || 'Marketing + IA de 0 a 100') + '</h1>' +
    '<p class="sub">' + (nombre ? esc(nombre) + ', ' : '') + 'acá vas a encontrar las grabaciones de las clases y la bibliografía que acompaña al curso. Tu acceso es permanente.</p></div></header>' +
    '<section class="az"><div class="wrap"><h2>Clases</h2>' + clases + '</div></section>' +
    '<section class="mf"><div class="wrap"><h2>Bibliografía y material de apoyo</h2>' +
    (mat ? '<ul class="mat">' + mat + '</ul>' : '<p class="vacio">Acá vas a encontrar toda la bibliografía que acompaña al curso. El material se va sumando a medida que avanzan las clases.</p>') + '</div></section>';
  document.getElementById('salir').hidden = false;
}
async function cargar() {
  try {
    const r = await fetch(CORE_API + '/api/curso/' + SLUG, { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { try { ['ct_token', 'ct_nombre'].forEach(k => localStorage.removeItem(k)); } catch (e) {} location.href = LOGIN_URL; return; }
    if (r.status === 403) { estado('Este contenido es para quienes se inscribieron', 'Tu cuenta todavía no tiene acceso al intensivo.', '<a class="btn" href="/cursos/capacitacion-marketing">Ver el intensivo</a>'); return; }
    if (!r.ok) throw new Error('http_' + r.status);
    render(await r.json());
  } catch (e) {
    estado('No pudimos cargar tu plataforma', 'Probá de nuevo en un momento.', '<a class="btn" href="">Reintentar</a>');
  }
}
document.getElementById('salir').addEventListener('click', () => {
  fetch(CORE_API + '/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(() => {});
  try { ['ct_token', 'ct_nombre'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
  location.href = LOGIN_URL;
});
if (token) cargar();
</script>
</body>
</html>
