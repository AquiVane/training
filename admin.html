<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel admin — Archivos | COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --az1:#0D2B6B;--az2:#1A4DAA;--az3:#3A8FC7;--ro1:#E02020;--ro2:#FF3535;--ve1:#16a34a;
  --gris:#6B7280;--gcl:#F8F8F6;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--gcl);color:#1a1a2e;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px}
h1{font-family:var(--serif);color:var(--az1);font-size:24px;margin-bottom:6px}
.sub{color:var(--gris);font-size:13.5px;margin-bottom:28px}

.gate{max-width:360px;margin:80px auto;background:#fff;border:1px solid #E2E8F0;border-radius:16px;
  padding:32px 28px;text-align:center}
.gate h2{font-family:var(--serif);color:var(--az1);font-size:19px;margin-bottom:14px}
.gate input{width:100%;border:1px solid #E2E8F0;border-radius:10px;padding:12px 14px;font-size:14px;
  font-family:inherit;margin-bottom:12px}
.gate button{width:100%;background:var(--az2);color:#fff;border:none;border-radius:10px;padding:12px;
  font-size:14px;font-weight:700;cursor:pointer}
.gate button:hover{background:var(--az1)}
.gate .err{color:var(--ro1);font-size:12.5px;margin-top:10px;min-height:16px}

.panel{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:24px;margin-bottom:20px}
.panel h2{font-size:15px;color:var(--az1);margin-bottom:14px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=file]{border:1px solid #E2E8F0;border-radius:8px;padding:9px 12px;font-size:13.5px;
  font-family:inherit;background:#fff}
.btn{background:var(--az2);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;
  font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--az1)}
.btn:disabled{background:#cbd5e1;cursor:not-allowed}
.upload-msg{font-size:12.5px;min-height:16px;margin-top:6px}
.upload-msg.ok{color:var(--ve1)}
.upload-msg.err{color:var(--ro1)}

.file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px solid #F1F5F9;font-size:13px}
.file-row:last-child{border-bottom:none}
.file-name{font-weight:700;word-break:break-all}
.file-meta{color:var(--gris);font-size:11.5px;margin-top:2px}
.file-actions{display:flex;gap:6px;flex-shrink:0}
.file-actions button{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:6px 10px;
  font-size:11.5px;cursor:pointer;font-family:inherit;color:#374151}
.file-actions button:hover{background:#EFF6FF}
.file-actions button.del{color:var(--ro1)}
.file-actions button.del:hover{background:#FEF2F2}
.empty{color:var(--gris);font-size:13px;text-align:center;padding:24px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>Panel admin</h2>
  <input type="password" id="gateKey" placeholder="Clave de administración">
  <button onclick="probarClave()">Entrar</button>
  <div class="err" id="gateErr"></div>
</div>

<div class="wrap" id="app" style="display:none">
  <div style="display:flex;gap:14px;margin-bottom:18px;font-size:12.5px">
    <a href="admin/dashboard.html" style="color:#1A4DAA">← Panel de control</a>
    <a href="admin/registros.html" style="color:#1A4DAA">Registros</a>
  </div>
  <h1>Panel admin — Archivos</h1>
  <p class="sub">Subí PDFs e imágenes para cualquier curso o e-book. Los archivos quedan públicos en la URL que te da cada uno — usala directo en el sitio.</p>

  <div class="panel">
    <h2>Subir archivo</h2>
    <div class="row">
      <select id="carpetaSelect">
        <option value="iaprincipiantes">IA para Principiantes</option>
        <option value="contenidosrrss">Estrategia de Contenido</option>
        <option value="productos-ganadores">Productos Ganadores</option>
        <option value="cutralco">Cutral-Có</option>
        <option value="general">General / otros</option>
      </select>
      <input type="file" id="fileInput" accept=".pdf,image/*">
      <button class="btn" id="uploadBtn" onclick="subirArchivo()">Subir</button>
    </div>
    <div class="upload-msg" id="uploadMsg"></div>
  </div>

  <div class="panel">
    <h2>Archivos de <span id="carpetaLabel">IA para Principiantes</span></h2>
    <div id="fileList"><div class="empty">Cargando…</div></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  Panel admin de archivos — sube/lista/borra en el bucket R2
//  training-product-files a través de cosmart-training-core.
//  Un solo secret compartido (ADMIN_UPLOAD_KEY) protege todo esto;
//  no hace falta cuenta de usuario, es de uso personal de Vaneh.
// ══════════════════════════════════════════════════════════════
const CORE_API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';

function getKey() { return sessionStorage.getItem('cosmart_admin_secret') || ''; }

async function probarClave() {
  const key = document.getElementById('gateKey').value.trim();
  const err = document.getElementById('gateErr');
  if (!key) return;
  err.textContent = 'Verificando...';
  try {
    const r = await fetch(`${CORE_API}/admin/files?carpeta=general`, { headers: { 'X-Admin-Key': key } });
    if (r.status === 401) { err.textContent = 'Clave incorrecta.'; return; }
    sessionStorage.setItem('cosmart_admin_secret', key);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    cargarLista();
  } catch(e) {
    err.textContent = 'Error de conexión.';
  }
}

const NOMBRES_CARPETA = {
  iaprincipiantes: 'IA para Principiantes',
  contenidosrrss: 'Estrategia de Contenido',
  'productos-ganadores': 'Productos Ganadores',
  cutralco: 'Cutral-Có',
  general: 'General / otros',
};

document.getElementById('carpetaSelect').addEventListener('change', () => {
  document.getElementById('carpetaLabel').textContent = NOMBRES_CARPETA[document.getElementById('carpetaSelect').value];
  cargarLista();
});

async function cargarLista() {
  const carpeta = document.getElementById('carpetaSelect').value;
  const cont = document.getElementById('fileList');
  cont.innerHTML = '<div class="empty">Cargando…</div>';
  try {
    const r = await fetch(`${CORE_API}/admin/files?carpeta=${carpeta}`, { headers: { 'X-Admin-Key': getKey() } });
    if (r.status === 401) { cerrarSesion(); return; }
    const d = await r.json();
    const items = d.items || [];
    if (!items.length) { cont.innerHTML = '<div class="empty">Todavía no hay archivos acá.</div>'; return; }
    cont.innerHTML = items.map(it => `
      <div class="file-row">
        <div>
          <div class="file-name">${it.key.split('/').pop()}</div>
          <div class="file-meta">${(it.size / 1024).toFixed(0)} KB · ${new Date(it.subido).toLocaleDateString('es-AR')}</div>
        </div>
        <div class="file-actions">
          <button onclick="copiarUrl('${it.url}')">Copiar link</button>
          <button class="del" onclick="borrarArchivo('${it.key}')">Borrar</button>
        </div>
      </div>
    `).join('');
  } catch(e) {
    cont.innerHTML = '<div class="empty">Error al cargar los archivos.</div>';
  }
}

async function subirArchivo() {
  const input = document.getElementById('fileInput');
  const msg = document.getElementById('uploadMsg');
  const btn = document.getElementById('uploadBtn');
  const file = input.files[0];
  if (!file) { msg.className = 'upload-msg err'; msg.textContent = 'Elegí un archivo primero.'; return; }

  const carpeta = document.getElementById('carpetaSelect').value;
  const form = new FormData();
  form.append('file', file);
  form.append('carpeta', carpeta);

  btn.disabled = true;
  msg.className = 'upload-msg';
  msg.textContent = 'Subiendo...';
  try {
    const r = await fetch(`${CORE_API}/admin/files`, {
      method: 'POST',
      headers: { 'X-Admin-Key': getKey() },
      body: form,
    });
    if (r.status === 401) { cerrarSesion(); return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error al subir');
    msg.className = 'upload-msg ok';
    msg.textContent = `✓ Subido: ${d.url}`;
    input.value = '';
    cargarLista();
  } catch(e) {
    msg.className = 'upload-msg err';
    msg.textContent = 'Error al subir el archivo.';
  } finally {
    btn.disabled = false;
  }
}

async function borrarArchivo(key) {
  if (!confirm('¿Borrar este archivo? No se puede deshacer.')) return;
  try {
    await fetch(`${CORE_API}/admin/files/${key}`, { method: 'DELETE', headers: { 'X-Admin-Key': getKey() } });
    cargarLista();
  } catch(e) { alert('Error al borrar.'); }
}

function copiarUrl(url) {
  navigator.clipboard.writeText(url).then(() => alert('Link copiado: ' + url));
}

function cerrarSesion() {
  sessionStorage.removeItem('cosmart_admin_secret');
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
  document.getElementById('gateErr').textContent = 'Tu sesión venció, ingresá la clave de nuevo.';
}

// Si ya había una clave guardada en esta sesión del navegador, entra directo.
if (getKey()) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  cargarLista();
}
</script>
</body>
</html>
