<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula virtual | COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Aula virtual privada de COSMART Training: tus clases en vivo, grabaciones y material.">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--az1:#0D2B6B;--az2:#1A4DAA;--az3:#3A8FC7;--ro:#E02020;--ro2:#FF3535;--bg:#060F22;--card:#0A1638;--txt:#E8ECF7;--txt2:#A9B4D3;--ok:#3ecf8e;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--az3);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px;width:100%}
.top{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:10px}
.top img{height:24px;width:auto;filter:brightness(1.4)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--ro);padding:4px 9px;border-radius:6px}
.salir{margin-left:auto}
main{flex:1;padding:24px 0 48px}
.eyebrow{color:#8fc3ec;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
h1{font-family:var(--serif);font-weight:900;color:#fff;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.15;margin:6px 0 8px;text-wrap:balance}
h2{font-family:var(--serif);font-weight:900;color:#fff;font-size:clamp(1.25rem,3.4vw,1.6rem);margin:0 0 14px}
h3{color:#fff;font-size:1.05rem}
.sub{color:var(--txt);max-width:60ch}
.muted{color:var(--txt2);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ro);color:#fff;text-decoration:none;font:700 15px var(--sans);border:0;border-radius:10px;padding:13px 22px;min-height:48px;cursor:pointer}
.btn:hover{background:var(--ro2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sec{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#fff;min-height:42px;padding:9px 16px;font-size:13.5px}
.btn.sec:hover{border-color:#fff;background:transparent}
.card{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px}
.clase-item{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;transition:border-color .15s}
.clase-item:hover{border-color:var(--az3)}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--az1);color:#fff;display:grid;place-items:center;font-weight:700}
.clase-item .info{flex:1;min-width:0}
.clase-item .info p{color:var(--txt2);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;border:1px solid rgba(255,255,255,.25);color:#fff;white-space:nowrap}
.chip.vivo{background:var(--ro);border-color:var(--ro)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.prox{border-color:var(--az3);color:#8fc3ec}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.espera{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:20px;background:linear-gradient(160deg,var(--az1),var(--card));border-radius:12px;border:1px solid rgba(255,255,255,.12)}
.espera p{max-width:44ch}
.cols{display:grid;gap:22px;margin-top:22px}
@media(min-width:860px){.cols{grid-template-columns:3fr 2fr;align-items:start}.wrap{padding:0 24px}}
label{display:block;font-weight:600;margin-bottom:6px;font-size:14.5px}
input,textarea{width:100%;font:16px var(--sans);color:#fff;background:#0b1a3f;border:1.5px solid rgba(255,255,255,.25);border-radius:10px;padding:12px 14px;min-height:48px}
textarea{min-height:110px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8ea0cc}
.fila{margin-bottom:14px}
.msg{font-size:14.5px;margin-top:10px;min-height:1.2em}
.msg.err{color:#ffb4b4}.msg.ok{color:var(--ok)}
.preg{border-top:1px solid rgba(255,255,255,.1);padding:12px 0}
.preg:first-child{border-top:0}
.preg .t{color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.preg .r{margin-top:8px;background:#0b1a3f;border-left:3px solid var(--ok);padding:8px 12px;border-radius:0 8px 8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.mats{list-style:none;display:grid;gap:10px}
.mats li{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#0b1a3f;border-radius:10px;padding:12px 14px}
.mats strong{color:#fff;overflow-wrap:anywhere}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:26px}
.estado{padding:40px 0;text-align:center}
.estado p{margin:8px auto 18px;max-width:52ch}
.vuelta{display:inline-block;margin-bottom:14px;color:#8fc3ec;text-decoration:none;font-weight:600;font-size:14.5px}
.vuelta:hover{text-decoration:underline}
.login{max-width:420px;margin:0 auto}
.login .link{background:none;border:0;color:#8fc3ec;font:600 14px var(--sans);cursor:pointer;text-decoration:underline;padding:8px 0;min-height:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{background:var(--bg);color:var(--txt2);padding:24px 0;font-size:13px;border-top:1px solid rgba(255,255,255,.08);text-align:center}
footer nav{margin-top:8px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}footer nav a{color:#c8d1ec}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <img src="https://cosmart.com.ar/Logo%20completo%20COSMART.png" alt="COSMART" width="120" height="24"><span class="badge">Aula</span>
  <button class="btn sec salir" id="salir" type="button" hidden>Salir</button>
</div></div>

<main><div class="wrap" id="app" aria-live="polite"><p class="muted">Cargando tu aula…</p></div></main>

<footer><div class="wrap">COSMART Training · Tu brújula digital.<nav><a href="/privacidad">Política de privacidad</a><a href="/terminos">Términos y condiciones</a></nav></div></footer>

<script>
(function () {
var API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';
var app = document.getElementById('app');
var salirBtn = document.getElementById('salir');
var params = new URLSearchParams(location.search);
var token = '', nombre = '';
try { token = localStorage.getItem('ct_token') || ''; nombre = localStorage.getItem('ct_nombre') || ''; } catch (e) {}
var timer = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function safeUrl(u) { try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } }
function fechaLarga(ms, tz) {
  try {
    var d = new Date(ms);
    var dia = new Intl.DateTimeFormat('es-AR', { timeZone: tz, weekday: 'long', day: 'numeric', month: 'long' }).format(d);
    var hora = new Intl.DateTimeFormat('es-AR', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
    return dia.charAt(0).toUpperCase() + dia.slice(1) + ', ' + hora + ' h';
  } catch (e) { return new Date(ms).toLocaleString('es-AR'); }
}
function chip(estado) {
  var m = { programada: ['prox', 'Programada'], en_vivo: ['vivo', 'En vivo'], finalizada: ['', 'Finalizada'], grabacion: ['ok', 'Grabación disponible'], cancelada: ['', 'Cancelada'] }[estado] || ['', ''];
  return '<span class="chip ' + m[0] + '">' + m[1] + '</span>';
}
function limpiarTimer() { if (timer) { clearInterval(timer); timer = null; } }
function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
  return fetch(API + path, opts).then(function (r) {
    if (r.status === 401) { cerrarSesionLocal(); mostrarLogin('Tu sesión venció. Ingresá de nuevo.'); throw new Error('401'); }
    return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, ok: r.ok, data: d }; });
  });
}
function cerrarSesionLocal() { token = ''; try { ['ct_token', 'ct_nombre', 'ct_apellido', 'ct_email'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {} salirBtn.hidden = true; }
function estado(titulo, texto, extra) {
  limpiarTimer();
  app.innerHTML = '<div class="estado"><h2>' + esc(titulo) + '</h2><p class="sub">' + esc(texto) + '</p>' + (extra || '') + '</div>';
}

// ── login / recuperación (misma cuenta que el resto de COSMART Training) ──
function mostrarLogin(aviso) {
  limpiarTimer();
  app.innerHTML =
    '<div class="login card"><span class="eyebrow">Aula virtual</span><h1>Ingresá a tu aula</h1>' +
    '<p class="muted" style="margin-bottom:16px">Usá el email y la contraseña con los que creaste tu cuenta de COSMART Training.</p>' +
    '<form id="fLogin" novalidate><div class="fila"><label for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email" required></div>' +
    '<div class="fila"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>' +
    '<button class="btn" type="submit" id="bLogin" style="width:100%">Ingresar</button><p class="msg ' + (aviso ? 'err' : '') + '" id="mLogin" role="status">' + esc(aviso || '') + '</p></form>' +
    '<button class="link" type="button" id="bOlvide">Olvidé mi contraseña</button></div>';
  document.getElementById('fLogin').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var em = document.getElementById('em').value.trim(), pw = document.getElementById('pw').value, m = document.getElementById('mLogin'), b = document.getElementById('bLogin');
    if (!em || !pw) { m.className = 'msg err'; m.textContent = 'Completá tu email y tu contraseña.'; return; }
    b.disabled = true; b.textContent = 'Ingresando…'; m.className = 'msg'; m.textContent = '';
    fetch(API + '/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: em, password: pw }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { m.className = 'msg err'; m.textContent = x.d.error || 'No pudimos ingresar.'; b.disabled = false; b.textContent = 'Ingresar'; return; }
        token = x.d.token; nombre = x.d.nombre || '';
        try { localStorage.setItem('ct_token', x.d.token); localStorage.setItem('ct_nombre', x.d.nombre || ''); localStorage.setItem('ct_apellido', x.d.apellido || ''); localStorage.setItem('ct_email', x.d.email || ''); } catch (e) {}
        enrutar();
      })
      .catch(function () { m.className = 'msg err'; m.textContent = 'Error de conexión. Probá de nuevo.'; b.disabled = false; b.textContent = 'Ingresar'; });
  });
  document.getElementById('bOlvide').addEventListener('click', mostrarOlvide);
}
function mostrarOlvide() {
  app.innerHTML =
    '<div class="login card"><span class="eyebrow">Recuperar acceso</span><h1>Te mandamos un link</h1>' +
    '<form id="fOlv" novalidate><div class="fila"><label for="eo">Email de tu cuenta</label><input id="eo" type="email" autocomplete="username" inputmode="email" required></div>' +
    '<button class="btn" type="submit" id="bOlv" style="width:100%">Enviar link</button><p class="msg" id="mOlv" role="status"></p></form>' +
    '<button class="link" type="button" id="bVolver">Volver a ingresar</button></div>';
  document.getElementById('bVolver').addEventListener('click', function () { mostrarLogin(); });
  document.getElementById('fOlv').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var em = document.getElementById('eo').value.trim(), m = document.getElementById('mOlv'), b = document.getElementById('bOlv');
    if (!em) { m.className = 'msg err'; m.textContent = 'Escribí tu email.'; return; }
    b.disabled = true;
    fetch(API + '/auth/forgot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: em }) })
      .then(function () { m.className = 'msg ok'; m.textContent = 'Si el email tiene cuenta, en unos minutos te llega el link. Revisá también el correo no deseado.'; })
      .catch(function () { m.className = 'msg err'; m.textContent = 'Error de conexión. Probá de nuevo.'; })
      .then(function () { b.disabled = false; });
  });
}

// ── mis cursos ──
function vistaCursos() {
  return api('/aula/cursos').then(function (r) {
    if (!r.ok) return estado('No pudimos cargar tu aula', 'Probá de nuevo en un momento.', '<button class="btn" onclick="location.reload()">Reintentar</button>');
    var cs = r.data.cursos || [];
    if (!cs.length) return estado('Todavía no tenés cursos en el aula', 'Cuando te inscribas en un curso con clases en vivo, va a aparecer acá.', '<a class="btn" href="/cursos">Ir a mis cursos</a>');
    app.innerHTML = '<span class="eyebrow">Aula virtual</span><h1>' + (nombre ? esc(nombre) + ', ' : '') + 'tus cursos</h1><div class="grid" style="margin-top:18px">' +
      cs.map(function (c) {
        return '<a class="card clase-item" href="/aula/?curso=' + encodeURIComponent(c.slug) + '"><div class="info"><h3>' + esc(c.titulo) + '</h3>' +
          (c.proxima ? '<p>Próxima clase: ' + esc(c.proxima.titulo) + ' · ' + esc(fechaLarga(c.proxima.inicia, c.zona)) + '</p>' : '<p>' + esc(c.descripcion || 'Entrá para ver tus clases.') + '</p>') + '</div><span class="btn" aria-hidden="true">Entrar</span></a>';
      }).join('') + '</div>';
  });
}

// ── clases del curso ──
function vistaCurso(slug) {
  return api('/aula/cursos/' + encodeURIComponent(slug)).then(function (r) {
    if (r.status === 403) return estado('Este curso no está habilitado en tu cuenta', r.data.error || '', '<a class="btn" href="/aula/">Volver a mis cursos</a>');
    if (!r.ok) return estado('No pudimos cargar el curso', 'Probá de nuevo en un momento.', '<button class="btn" onclick="location.reload()">Reintentar</button>');
    var c = r.data.curso, cl = r.data.clases || [];
    app.innerHTML = '<a class="vuelta" href="/aula/">← Mis cursos</a><span class="eyebrow" style="display:block">Curso</span><h1>' + esc(c.titulo) + '</h1>' +
      (c.descripcion ? '<p class="sub">' + esc(c.descripcion) + '</p>' : '') +
      '<div class="grid" style="margin-top:20px">' + (cl.length ? cl.map(function (k) {
        return '<a class="card clase-item" href="/aula/?clase=' + encodeURIComponent(k.id) + '"><span class="num">' + esc(k.numero) + '</span><div class="info"><h3>' + esc(k.titulo) + '</h3><p>' + esc(fechaLarga(k.inicia, c.zona)) + '</p></div>' + chip(k.estado) + '</a>';
      }).join('') : '<p class="muted">Todavía no hay clases publicadas. Cuando se programen, aparecen acá.</p>') + '</div>';
  });
}

// ── clase (aula) ──
function vistaClase(id) {
  return api('/aula/clases/' + encodeURIComponent(id)).then(function (r) {
    if (r.status === 403) return estado('No tenés acceso a esta clase', r.data.error || '', '<a class="btn" href="/aula/">Volver a mis cursos</a>');
    if (r.status === 404) return estado('No encontramos esta clase', '', '<a class="btn" href="/aula/">Volver a mis cursos</a>');
    if (!r.ok) return estado('No pudimos cargar la clase', 'Probá de nuevo en un momento.', '<button class="btn" onclick="location.reload()">Reintentar</button>');
    dibujarClase(r.data);
  });
}
function dibujarClase(d) {
  var c = d.clase, curso = d.curso;
  var player;
  if (d.video) {
    player = '<div class="video"><iframe src="https://www.youtube.com/embed/' + encodeURIComponent(d.video.id) + '?rel=0&modestbranding=1&playsinline=1" title="Clase ' + esc(c.numero) + ': ' + esc(c.titulo) + '" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
  } else {
    var txt = c.estado === 'finalizada' ? 'La clase terminó. La grabación aparece acá apenas esté disponible.'
      : c.estado === 'en_vivo' ? 'La clase está en vivo. Estamos conectando la transmisión; esta página se actualiza sola.'
      : 'La clase empieza el ' + fechaLarga(c.inicia, curso.zona) + '. El video se habilita acá unos minutos antes; esta página se actualiza sola.';
    player = '<div class="espera"><p><strong style="color:#fff;display:block;font-size:1.1rem;margin-bottom:6px">Todavía no empezó</strong>' + esc(txt) + '</p></div>';
  }
  var nav = '<div class="nav">' + (d.anterior ? '<a class="btn sec" href="/aula/?clase=' + encodeURIComponent(d.anterior.id) + '">← Clase ' + esc(d.anterior.numero) + '</a>' : '<span></span>') +
    (d.siguiente ? '<a class="btn sec" href="/aula/?clase=' + encodeURIComponent(d.siguiente.id) + '">Clase ' + esc(d.siguiente.numero) + ' →</a>' : '') + '</div>';
  var mats = (d.materiales || []).map(function (m) {
    var u = safeUrl(m.url);
    return u ? '<li><strong>' + esc(m.title) + '</strong><a class="btn sec" href="' + esc(u) + '" target="_blank" rel="noopener">' + (m.kind === 'pdf' || m.kind === 'download' ? 'Descargar' : 'Abrir') + '</a></li>' : '';
  }).join('');
  app.innerHTML =
    '<a class="vuelta" href="/aula/?curso=' + encodeURIComponent(curso.slug) + '">← ' + esc(curso.titulo) + '</a>' +
    '<span class="eyebrow" style="display:block">Clase ' + esc(c.numero) + '</span><h1>' + esc(c.titulo) + '</h1>' +
    '<p class="muted" style="margin-bottom:14px">' + esc(fechaLarga(c.inicia, curso.zona)) + ' · ' + esc(c.duracionMin) + ' min &nbsp;' + chip(c.estado) + '</p>' +
    player + (c.descripcion ? '<p class="sub" style="margin-top:14px">' + esc(c.descripcion) + '</p>' : '') +
    '<div class="cols"><section class="card" aria-labelledby="hp"><h2 id="hp">Tus preguntas</h2>' +
      '<form id="fPreg" novalidate><label for="tp">Escribí tu pregunta para la clase</label><textarea id="tp" maxlength="1000" placeholder="Tu pregunta…"></textarea>' +
      '<div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px"><span class="muted" id="cnt">0 / 1000</span><button class="btn" id="bPreg" type="submit">Enviar pregunta</button></div>' +
      '<p class="msg" id="mPreg" role="status"></p></form><p class="muted" style="margin-top:6px">Solo vos ves tus preguntas. La docente las recibe y las responde durante la clase.</p>' +
      '<div id="lista" style="margin-top:12px"></div></section>' +
    '<section class="card" aria-labelledby="hm"><h2 id="hm">Material</h2>' + (mats ? '<ul class="mats">' + mats + '</ul>' : '<p class="muted">El material de esta clase se va a ir sumando acá.</p>') + '</section></div>' + nav;
  pintarPreguntas(d.preguntas || []);
  var tp = document.getElementById('tp'), cnt = document.getElementById('cnt');
  tp.addEventListener('input', function () { cnt.textContent = tp.value.length + ' / 1000'; });
  document.getElementById('fPreg').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var t = tp.value.trim(), m = document.getElementById('mPreg'), b = document.getElementById('bPreg');
    if (!t) { m.className = 'msg err'; m.textContent = 'Escribí tu pregunta antes de enviarla.'; return; }
    b.disabled = true; b.textContent = 'Enviando…'; m.className = 'msg'; m.textContent = '';
    api('/aula/clases/' + encodeURIComponent(c.id) + '/preguntas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texto: t }) })
      .then(function (r) {
        if (!r.ok) { m.className = 'msg err'; m.textContent = r.data.error || 'No pudimos enviar tu pregunta.'; return; }
        m.className = 'msg ok'; m.textContent = '¡Recibimos tu pregunta!'; tp.value = ''; cnt.textContent = '0 / 1000';
        d.preguntas = [r.data.pregunta].concat(d.preguntas || []); pintarPreguntas(d.preguntas);
      })
      .catch(function () { m.className = 'msg err'; m.textContent = 'Error de conexión. Probá de nuevo.'; })
      .then(function () { b.disabled = false; b.textContent = 'Enviar pregunta'; });
  });
  // Actualización liviana (cada 60 s, solo con la pestaña visible) mientras la clase no terminó
  limpiarTimer();
  if (c.estado === 'programada' || c.estado === 'en_vivo' || (c.estado === 'finalizada' && !d.video)) {
    timer = setInterval(function () {
      if (document.hidden) return;
      var escribiendo = document.activeElement && document.activeElement.id === 'tp' && document.getElementById('tp').value;
      api('/aula/clases/' + encodeURIComponent(c.id)).then(function (r) {
        if (!r.ok) return;
        var cambioVideo = !!r.data.video !== !!d.video, cambioEstado = r.data.clase.estado !== c.estado;
        if (cambioVideo || cambioEstado) { if (!escribiendo) dibujarClase(r.data); }
        else { d.preguntas = r.data.preguntas; pintarPreguntas(d.preguntas); }
      }).catch(function () {});
    }, 60000);
  }
}
function pintarPreguntas(ps) {
  var el = document.getElementById('lista'); if (!el) return;
  el.innerHTML = ps.length ? ps.map(function (p) {
    return '<div class="preg"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px"><span class="chip ' + (p.estado === 'respondida' ? 'ok' : '') + '">' + (p.estado === 'respondida' ? 'Respondida' : 'Enviada') + '</span><span class="muted">' + esc(new Date(p.fecha).toLocaleString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</span></div><div class="t">' + esc(p.texto) + '</div>' + (p.respuesta ? '<div class="r"><strong>Respuesta:</strong> ' + esc(p.respuesta) + '</div>' : '') + '</div>';
  }).join('') : '<p class="muted">Todavía no enviaste preguntas en esta clase.</p>';
}

function enrutar() {
  salirBtn.hidden = false;
  var clase = params.get('clase'), curso = params.get('curso');
  var p = clase ? vistaClase(clase) : curso ? vistaCurso(curso) : vistaCursos();
  p.catch(function (e) { if (e && e.message !== '401') estado('No pudimos cargar tu aula', 'Revisá tu conexión y probá de nuevo.', '<button class="btn" onclick="location.reload()">Reintentar</button>'); });
}
salirBtn.addEventListener('click', function () {
  fetch(API + '/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(function () {});
  cerrarSesionLocal(); mostrarLogin();
});
if (token) enrutar(); else mostrarLogin();
})();
</script>
