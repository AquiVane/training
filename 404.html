<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producto — COSMART Training</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/images/favicon.ico?v=3">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --az1:#0D2B6B;--az2:#1A4DAA;--az3:#3A8FC7;
  --ro1:#E02020;--ro2:#FF3535;--ve1:#16a34a;--am1:#b45309;
  --gris:#6B7280;--gcl:#F8F8F6;
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);background:var(--gcl);color:#1a1a2e}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

.tienda-header{background:#060f22;padding:16px 20px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.tienda-header .logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.tienda-header img{height:32px}
.tienda-header .training-txt{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--ro1);padding:4px 9px;border-radius:6px}
.tienda-header a.back{color:rgba(255,255,255,.8);font-size:13px;text-decoration:none}
.tienda-header a.back:hover{color:#fff}

/* ── HERO / PDP ── */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:40px 20px 20px;max-width:1100px;margin:0 auto}
@media(max-width:860px){.pdp{grid-template-columns:1fr;gap:24px;padding:24px 16px 8px}}

.gallery-main{background:repeating-linear-gradient(45deg,#F1F5F9,#F1F5F9 12px,#E2E8F0 12px,#E2E8F0 24px);
  border:2px dashed #CBD5E1;border-radius:16px;aspect-ratio:4/3;display:flex;align-items:center;
  justify-content:center;color:#94a3b8;font-size:13px;text-align:center;padding:20px;margin-bottom:10px}
.gallery-main img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}
.gallery-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gallery-thumb{background:repeating-linear-gradient(45deg,#F1F5F9,#F1F5F9 8px,#E2E8F0 8px,#E2E8F0 16px);
  border:1.5px dashed #CBD5E1;border-radius:8px;aspect-ratio:1;display:flex;align-items:center;
  justify-content:center;color:#94a3b8;font-size:10px;text-align:center;padding:4px}

.badge-line{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.badge{background:#FFFBEB;color:var(--am1);font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:99px;letter-spacing:.02em}
.badge.urgency{background:#FEE2E2;color:var(--ro1)}
h1{font-family:var(--serif);font-size:clamp(1.7rem,3.4vw,2.3rem);color:var(--az1);font-weight:800;
  line-height:1.2;margin-bottom:10px}
.subpitch{color:var(--gris);font-size:15px;line-height:1.6;margin-bottom:14px}

.rating-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris);margin-bottom:20px}
.stars{color:#F59E0B;font-size:14px;letter-spacing:1px}

.variant-select{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.variant-card{border:2px solid #E2E8F0;border-radius:14px;padding:16px 18px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.variant-card:hover{border-color:var(--az3)}
.variant-card.selected{border-color:var(--az2);background:#EFF6FF}
.variant-card .vc-radio{width:18px;height:18px;border-radius:50%;border:2px solid #CBD5E1;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.variant-card.selected .vc-radio{border-color:var(--az2)}
.variant-card.selected .vc-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--az2)}
.vc-info{flex:1}
.vc-name{font-size:14.5px;font-weight:700;color:#1a1a2e;margin-bottom:2px}
.vc-desc{font-size:12.5px;color:var(--gris);line-height:1.5}
.vc-price{text-align:right;white-space:nowrap}
.vc-price .p-ars{font-family:var(--serif);font-size:19px;font-weight:900;color:var(--az1);display:block}
.vc-price .p-usd{font-size:11px;color:#94a3b8}

.price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.price-row .price{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--az1)}
.price.discount{color:var(--ro1)}
.price-row .price-tachado{font-size:15px;color:#94a3b8;text-decoration:line-through}
.price-usd{font-size:13px;color:var(--gris);margin-bottom:22px}

.cta-row{display:flex;gap:10px;margin-bottom:14px}
@media(max-width:420px){.cta-row{flex-direction:column}}

/* ── BARRA FIJA ABAJO (solo mobile, estilo Shein) ── */
.mobile-cta-bar{display:none}
@media(max-width:760px){
  body{padding-bottom:76px}
  .cta-row{display:none}
  .pdp{gap:14px;padding:16px 16px 4px}
  .subpitch{font-size:13.5px;margin-bottom:10px}
  .rating-row{margin-bottom:12px}
  section.pdp-section{padding:22px 16px}
  .mobile-cta-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;background:#fff;
    border-top:1px solid #E2E8F0;padding:10px 16px;align-items:center;gap:12px;
    box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .mobile-cta-bar .mcb-price{flex:1;min-width:0}
  .mobile-cta-bar .mcb-urgency{font-size:10.5px;color:var(--ro1);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-cta-bar .mcb-price-row{display:flex;align-items:baseline;gap:6px}
  .mobile-cta-bar .price{font-size:20px}
  .mobile-cta-bar .price-tachado{font-size:12px}
  .mobile-cta-bar .btn-primary{flex:none;padding:12px 22px;font-size:14px;white-space:nowrap}
}
.btn-primary{background:var(--ro1);color:#fff;border:none;border-radius:10px;padding:15px 20px;
  font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);flex:1.3;text-align:center}
.btn-primary:hover{background:var(--ro2)}
.btn-secondary{background:#fff;border:1.5px solid var(--az2);color:var(--az2);border-radius:10px;
  padding:14px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:var(--sans);flex:1;text-align:center}
.btn-secondary:hover{background:#EFF6FF}
.cart-fb{font-size:12.5px;color:var(--ve1);font-weight:700;min-height:16px;margin-bottom:10px}

.trust-list{list-style:none;font-size:13px;color:#374151;line-height:2}
.trust-list li::before{content:'✓ ';color:var(--ve1);font-weight:800}

/* ── SECCIONES ── */
section.pdp-section{max-width:1100px;margin:0 auto;padding:36px 20px}
section.pdp-section h2{font-family:var(--serif);font-size:22px;color:var(--az1);margin-bottom:18px}
.aprende-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.aprende-item{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px 18px;font-size:13.5px;
  line-height:1.6;color:#374151}
.aprende-item strong{color:var(--az1);display:block;margin-bottom:4px;font-size:14px}

.temario{border:1px solid #E2E8F0;border-radius:14px;overflow:hidden;background:#fff}
.temario-modulo{border-bottom:1px solid #F1F5F9}
.temario-modulo:last-child{border-bottom:none}
.tm-head{width:100%;background:none;border:none;padding:16px 20px;display:flex;justify-content:space-between;
  align-items:center;cursor:pointer;font-family:var(--sans);text-align:left}
.tm-head:hover{background:#F8FAFC}
.tm-head .tmh-name{font-size:14.5px;font-weight:700;color:var(--az1)}
.tm-head .tmh-count{font-size:12px;color:var(--gris);margin-top:2px}
.tm-head .tmh-arrow{color:var(--gris);transition:transform .2s;flex-shrink:0;margin-left:12px}
.temario-modulo.open .tmh-arrow{transform:rotate(180deg)}
.tm-body{display:none;padding:0 20px 16px}
.temario-modulo.open .tm-body{display:block}
.tm-body ol{padding-left:20px}
.tm-body li{font-size:13px;color:#374151;line-height:2}

.compare-table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;
  border:1px solid #E2E8F0;font-size:13.5px}
.compare-table th,.compare-table td{padding:14px 16px;text-align:left;border-bottom:1px solid #F1F5F9}
.compare-table th{background:#F8FAFC;font-size:13px;color:var(--gris)}
.compare-table td.yes{color:var(--ve1);font-weight:700}
.compare-table td.no{color:#cbd5e1}

.reviews-empty{background:#fff;border:1px dashed #CBD5E1;border-radius:14px;padding:32px 24px;text-align:center;
  color:var(--gris);font-size:13.5px;line-height:1.7}
.review-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:18px 20px;margin-bottom:12px}
.review-card .rc-stars{color:#F59E0B;font-size:13px;margin-bottom:6px}
.review-card .rc-text{font-size:13.5px;color:#374151;line-height:1.6;margin-bottom:8px}
.review-card .rc-name{font-size:12px;color:var(--gris);font-weight:700}

.upsell-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.upsell-card{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:18px 20px}
.upsell-card h3{font-family:var(--serif);font-size:16px;color:var(--az1);margin-bottom:6px}
.upsell-card p{font-size:12.5px;color:var(--gris);line-height:1.5;margin-bottom:12px}
.upsell-card .up-price{font-size:14px;font-weight:800;color:var(--az1);margin-bottom:10px}
.upsell-card a{display:block;text-align:center;background:var(--az2);color:#fff;text-decoration:none;
  border-radius:8px;padding:10px;font-size:13px;font-weight:700}
.upsell-card a:hover{background:var(--az1)}

.faq-item{border-bottom:1px solid #E2E8F0;padding:16px 0}
.faq-item h3{font-size:14.5px;color:#1a1a2e;margin-bottom:6px}
.faq-item p{font-size:13.5px;color:var(--gris);line-height:1.6}

.notfound{text-align:center;padding:100px 20px;color:var(--gris)}
.notfound a{color:var(--az2);font-weight:700;text-decoration:none}
.loading{text-align:center;padding:100px 20px;color:var(--gris)}

/* ══════════════════════════════════════════════════════════════
   Estética "v2" (navy/rojo, estilo Cutral-Có) -- se activa agregando
   la clase body.v2 cuando la URL matchea /tienda-v2/{slug} en vez de
   /tienda/{slug}. Mismo HTML/JS, mismo PRODUCT_DB -- solo cambian
   estos colores, igual que tienda-v2.html vs tienda.html.
   ══════════════════════════════════════════════════════════════ */
body.v2{background:#060f22;color:#e8ecf7}
body.v2 .gallery-main{background:repeating-linear-gradient(45deg,#0A1638,#0A1638 12px,#0d1c47 12px,#0d1c47 24px);border-color:rgba(224,32,32,.4);color:#93a0c2}
body.v2 .gallery-thumb{background:repeating-linear-gradient(45deg,#0A1638,#0A1638 8px,#0d1c47 8px,#0d1c47 16px);border-color:rgba(224,32,32,.3);color:#93a0c2}
body.v2 .badge{background:rgba(255,255,255,.08);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
body.v2 .badge.urgency{background:rgba(224,32,32,.15);color:#ff8a80}
body.v2 h1{color:#fff}
body.v2 .subpitch{color:#93a0c2}
body.v2 .rating-row{color:#93a0c2}
body.v2 .variant-card{border-color:rgba(255,255,255,.15)}
body.v2 .variant-card:hover{border-color:var(--ro1)}
body.v2 .variant-card.selected{border-color:var(--ro1);background:rgba(224,32,32,.1)}
body.v2 .variant-card .vc-radio{border-color:rgba(255,255,255,.3)}
body.v2 .variant-card.selected .vc-radio{border-color:var(--ro1)}
body.v2 .variant-card.selected .vc-radio::after{background:var(--ro1)}
body.v2 .vc-name{color:#e8ecf7}
body.v2 .vc-desc{color:#93a0c2}
body.v2 .vc-price .p-ars{color:#fff}
body.v2 .price-row .price{color:#fff}
body.v2 .price.discount{color:#ff5252}
body.v2 .price-usd{color:#93a0c2}
body.v2 .btn-primary{background:var(--ro1)}
body.v2 .btn-primary:hover{background:#c01818}
body.v2 .btn-secondary{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
body.v2 .btn-secondary:hover{background:rgba(255,255,255,.08);border-color:#fff}
body.v2 .trust-list{color:#c7d0e8}
body.v2 .mobile-cta-bar{background:#0A1638;border-top-color:rgba(255,255,255,.1)}
body.v2 section.pdp-section h2{color:#fff}
body.v2 .aprende-item{background:#0A1638;border-color:rgba(255,255,255,.1);color:#c7d0e8}
body.v2 .aprende-item strong{color:#fff}
body.v2 .temario{background:#0A1638;border-color:rgba(255,255,255,.1)}
body.v2 .temario-modulo{border-bottom-color:rgba(255,255,255,.08)}
body.v2 .tm-head:hover{background:rgba(255,255,255,.04)}
body.v2 .tm-head .tmh-name{color:#fff}
body.v2 .tm-head .tmh-count{color:#93a0c2}
body.v2 .tm-head .tmh-arrow{color:#93a0c2}
body.v2 .tm-body li{color:#c7d0e8}
body.v2 .compare-table{background:#0A1638;border-color:rgba(255,255,255,.1)}
body.v2 .compare-table th,body.v2 .compare-table td{border-bottom-color:rgba(255,255,255,.08)}
body.v2 .compare-table th{background:rgba(255,255,255,.03);color:#93a0c2}
body.v2 .compare-table td.no{color:#4b5a82}
body.v2 .reviews-empty{background:#0A1638;border-color:rgba(255,255,255,.2);color:#93a0c2}
body.v2 .review-card{background:#0A1638;border-color:rgba(255,255,255,.1)}
body.v2 .review-card .rc-text{color:#c7d0e8}
body.v2 .review-card .rc-name{color:#93a0c2}
body.v2 .upsell-card{background:#0A1638;border-color:rgba(255,255,255,.1)}
body.v2 .upsell-card h3{color:#fff}
body.v2 .upsell-card p{color:#93a0c2}
body.v2 .upsell-card .up-price{color:#fff}
body.v2 .upsell-card a{background:var(--ro1)}
body.v2 .upsell-card a:hover{background:#c01818}
body.v2 .faq-item{border-bottom-color:rgba(255,255,255,.1)}
body.v2 .faq-item h3{color:#e8ecf7}
body.v2 .faq-item p{color:#93a0c2}
body.v2 .notfound{color:#93a0c2}
body.v2 .loading{color:#93a0c2}
</style>
</head>

  <a class="logo" href="/tienda.html" id="headerLogo">
    <img src="https://cosmart.com.ar/Logo%20completo%20COSMART.png" alt="COSMART">
    <span class="training-txt">Training</span>
  </a>
  <a class="back" href="/tienda.html" id="headerBack">← Volver a la tienda</a>
</header>

<div id="app"><div class="loading">Cargando producto...</div></div>

<footer style="background:#060f22;padding:32px 20px;margin-top:20px;font-family:'DM Sans',sans-serif">
  <div style="max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center">
    <div style="color:#64748b;font-size:12px;line-height:1.7">
      COSMART · Contenido digital — programas online y e-books. CUIT 27315338986.<br>
      <a href="mailto:info@cosmart.com.ar" style="color:#3A8FC7">mail</a>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">

      <a href="/privacidad.html" style="color:#94a3b8;font-size:12px;text-decoration:none">Privacidad</a>

<script>
// ══════════════════════════════════════════════════════════════
//  /404.html -- también hace de página de producto para /tienda/{slug}
//  Y para /tienda-v2/{slug} (mismo archivo, misma PRODUCT_DB -- ver
//  TIENDA_PREFIX más abajo). GitHub Pages sirve este archivo (con la
//  URL original intacta en la barra) para cualquier ruta que no exista
//  como archivo real -- es el truco estándar para tener URLs limpias
//  tipo /tienda/nombre en un hosting 100% estático (sin backend de
//  routing). Por eso TODOS los links/recursos acá adentro usan rutas
//  absolutas (con / adelante): si usáramos rutas relativas, resolverían
//  mal porque el navegador las arma en base a /tienda/{slug}, no a la
//  raíz del sitio.
//
//  Si la URL no matchea /tienda/{slug} ni /tienda-v2/{slug}, se muestra
//  un 404 genérico.
// ══════════════════════════════════════════════════════════════

const CORE_API = 'https://cosmart-training-core.conglomeradocosmart.workers.dev';
let TIENDA_PREFIX = 'tienda'; // 'tienda' o 'tienda-v2', se fija en init()

function formatoARS(n) { return '$' + Number(n).toLocaleString('es-AR'); }
function getCarrito() { try { return JSON.parse(localStorage.getItem('ct_carrito') || '[]'); } catch(e) { return []; } }
function setCarrito(items) { localStorage.setItem('ct_carrito', JSON.stringify(items)); }

// FAQ genérica reusable (hechos reales del sitio, no específicos de un curso)
const FAQ_PAGO = {
  h3: '¿Con qué medios puedo pagar?',
  p: 'En pesos con Mercado Pago (todas las tarjetas) o en dólares con PayPal, si estás fuera de Argentina.',
};
const FAQ_DEVOLUCION = {
  h3: '¿Hay devoluciones?',
  p: 'Es contenido digital: una vez que accedés a tu cuenta, se considera entregado. Tenés 10 minutos desde la compra para arrepentirte sin costo si todavía no accediste. Ver <a href="/devoluciones.html">Política de Devoluciones</a>.',
};
const FAQ_TECNOLOGIA = {
  h3: '¿Necesito saber de tecnología?',
  p: 'No. Está pensado para emprendedores, profesionales y dueños de pyme sin experiencia previa — vas paso a paso.',
};

// ══════════════════════════════════════════════════════════════
//  BASE DE PRODUCTOS -- misma info que tienda.html, con el contenido
//  extendido para la ficha completa (temario solo cuando es real y
//  verificado; nunca se inventa un temario para no meter la pata con
//  lo que la clienta va a recibir).
// ══════════════════════════════════════════════════════════════
const PRODUCT_DB = {
  'iaprincipiantes': {
    tipo: 'variantes',
    badge: '📖 Campus + E-book',
    urgencia: '🔥 Precio de lanzamiento',
    nombre: 'IA para Emprendedores',
    subpitch: 'El sistema paso a paso para que la IA trabaje para vos todos los días — sin tecnicismos, sea que estés arrancando de cero o quieras perfeccionarte. 46 lecciones en 8 módulos: identidad de marca, ChatGPT, Claude, copywriting persuasivo y emails automáticos.',
    variantes: [
      { id: 'ebook', nombre: 'E-book', desc: 'Las 46 lecciones completas para leer y aplicar a tu ritmo, con todos los prompts copiables.', precio: 79990, precioUsd: 54 },
      { id: 'campus', nombre: 'Campus + E-book', desc: 'Todo el e-book, más ejercicios corregidos, mini-evaluaciones y certificado final al completar el curso.', precio: 119990, precioUsd: 81, recomendada: true },
    ],
    trustList: [
      'Accedé cuando quieras, a tu ritmo, desde tu cuenta',
      'Pago en pesos (Mercado Pago) o en dólares (PayPal)',
      'Certificado al completar el curso (variante Campus)',
    ],
    aprende: [
      { t: 'Tu identidad de marca en IA', d: 'El documento base que le da a cualquier herramienta el contexto de tu marca, para que deje de sonar genérica.' },
      { t: 'ChatGPT sin vueltas', d: 'Gratis vs. Plus, GPT Personalizados, y la estructura de un buen prompt de flyer con ejemplos reales.' },
      { t: 'Claude a fondo', d: 'Chat, Code y Cowork explicados, Projects para pedir un plan de marketing completo en minutos.' },
      { t: 'Copywriting persuasivo con IA', d: 'AIDA, PAS, los triggers de Sugarman y por qué los textos hechos con IA "suenan a IA" (y cómo arreglarlo).' },
      { t: 'Emails HTML automáticos', d: 'Armá tu plantilla con Claude Code y enviala gratis con Brevo — dominio propio, SPF/DKIM/DMARC incluido.' },
      { t: 'Tu semana tipo', d: 'Cómo encadenar todas las herramientas en un flujo real, aplicado a indumentaria y a un servicio profesional.' },
    ],
    temarioTitulo: 'Temario completo — 8 módulos, 46 lecciones',

// la tienda (iaprincipiantes muestra "desde" con su variante recomendada).

  { slug: 'iaprincipiantes', nombre: 'IA para Emprendedores', desc: 'El sistema paso a paso para que la IA trabaje para vos todos los días.', precio: 79990 },

function notFound() {
  const tiendaHtml = TIENDA_PREFIX === 'tienda-v2' ? '/tienda-v2.html' : '/tienda.html';
  document.getElementById('app').innerHTML = `
    <div class="notfound">
      <p>No encontramos esta página.</p>
      <p style="margin-top:10px"><a href="${tiendaHtml}">← Volver a la tienda</a></p>
    </div>`;
}

let slug = null;
let producto = null;
let varianteActual = null;

function render() {
  const app = document.getElementById('app');
  const esVariantes = producto.tipo === 'variantes';

  const mediaHtml = producto.imagenUrl
    ? `<div class="gallery-main"><img src="${producto.imagenUrl}" alt="${producto.nombre}"></div>`
    : `<div class="gallery-main">📘 Portada del e-book / campus — imagen a subir</div>

         <div class="gallery-thumb">Prompt en uso</div>
         <div class="gallery-thumb">Certificado</div>
         <div class="gallery-thumb">Módulos</div>
       </div>`;

  const precioHtml = esVariantes
    ? `<div class="variant-select" id="variantSelect"></div>`
    : `<div class="price-row">
         ${producto.precioTachado ? `<span class="price-tachado">${formatoARS(producto.precioTachado)}</span>` : ''}
         <span class="price${producto.precioTachado ? ' discount' : ''}">${formatoARS(producto.precio)}</span>
       </div>
       <p class="price-usd">${producto.precioUsdTachado ? `<span style="text-decoration:line-through">USD ${producto.precioUsdTachado}</span> ` : ''}USD ${producto.precioUsd}</p>`;

  app.innerHTML = `
    <div class="pdp">
      <div>${mediaHtml}</div>
      <div>
        <div class="badge-line">
          <span class="badge">${producto.badge}</span>
          ${producto.urgencia ? `<span class="badge urgency">${producto.urgencia}</span>` : ''}
        </div>
        <h1>${producto.nombre}</h1>
        <p class="subpitch">${producto.subpitch || producto.desc || ''}</p>
        <div class="rating-row" id="ratingRow">
          <span class="stars">★★★★★</span>
          <span id="ratingText">Cargando reseñas…</span>
        </div>
        ${precioHtml}
        <div class="cart-fb" id="cartFb"></div>
        <div class="cta-row">
          <button class="btn-primary" id="buyBtn">Comprar ahora →</button>
          <button class="btn-secondary" id="addBtn">Agregar al carrito</button>
        </div>
        <ul class="trust-list">${(producto.trustList || []).map(t => `<li>${t}</li>`).join('')}</ul>
      </div>
    </div>

    <div class="mobile-cta-bar">
      <div class="mcb-price">
        <div class="mcb-urgency" id="mcbUrgency"></div>
        <div class="mcb-price-row" id="mcbPriceRow"></div>
      </div>
      <button class="btn-primary" id="mobAddBtn">Agregar al carrito</button>
    </div>

    ${producto.aprende ? `
    <section class="pdp-section">
      <h2>Qué vas a aprender</h2>
      <div class="aprende-grid">${producto.aprende.map(a => `<div class="aprende-item"><strong>${a.t}</strong>${a.d}</div>`).join('')}</div>
    </section>` : ''}

    ${producto.temario ? `
    <section class="pdp-section">
      <h2>${producto.temarioTitulo}</h2>
      <div class="temario" id="temario"></div>
    </section>` : ''}

    ${producto.compareRows ? `
    <section class="pdp-section">
      <h2>${producto.compareTitulo}</h2>
      <div style="overflow-x:auto">
        <table class="compare-table">
          <tr><th>Incluye</th><th>${producto.variantes[0].nombre}</th><th>${producto.variantes[1].nombre}</th></tr>
          ${producto.compareRows.map(r => `<tr><td>${r[0]}</td><td class="${r[1] ? 'yes' : 'no'}">${r[1] ? '✓' : '—'}</td><td class="${r[2] ? 'yes' : 'no'}">${r[2] ? '✓' : '—'}</td></tr>`).join('')}
        </table>
      </div>
    </section>` : ''}

    <section class="pdp-section">
      <h2>Reseñas</h2>
      <div id="reviewsWrap"><div class="reviews-empty">Cargando reseñas…</div></div>
    </section>

    <section class="pdp-section">
      <h2>También te puede interesar</h2>
      <div class="upsell-grid" id="upsellGrid"></div>
    </section>

    ${producto.faq ? `
    <section class="pdp-section">
      <h2>Preguntas frecuentes</h2>

// Mantiene la barra fija de abajo (mobile) sincronizada con el precio
// vigente -- incluida la variante elegida, si el producto tiene.
function actualizarBarraMobile() {
  const enVariante = producto.tipo === 'variantes';
  const precioActual = enVariante ? varianteActual.precio : producto.precio;
  const tachado = enVariante ? null : producto.precioTachado;
  document.getElementById('mcbUrgency').textContent = producto.urgencia || '';
  document.getElementById('mcbPriceRow').innerHTML = `
    ${tachado ? `<span class="price-tachado">${formatoARS(tachado)}</span>` : ''}
    <span class="price${tachado ? ' discount' : ''}">${formatoARS(precioActual)}</span>
  `;
}

function renderVariantes() {
  const el = document.getElementById('variantSelect');
  el.innerHTML = producto.variantes.map(v => `
    <div class="variant-card ${v.id === varianteActual.id ? 'selected' : ''}" data-vid="${v.id}">
      <div class="vc-radio"></div>
      <div class="vc-info">
        <div class="vc-name">${v.nombre}${v.recomendada ? ' · recomendada' : ''}</div>
        <div class="vc-desc">${v.desc}</div>
      </div>
      <div class="vc-price"><span class="p-ars">${formatoARS(v.precio)}</span><span class="p-usd">USD ${v.precioUsd}</span></div>
    </div>
  `).join('');
  el.querySelectorAll('.variant-card').forEach(card => {
    card.addEventListener('click', () => {
      varianteActual = producto.variantes.find(v => v.id === card.dataset.vid);
      renderVariantes();
      actualizarBarraMobile();
    });
  });
}

function renderTemario() {
  document.getElementById('temario').innerHTML = producto.temario.map((m, i) => `
    <div class="temario-modulo${i === 0 ? ' open' : ''}" data-idx="${i}">
      <button class="tm-head" type="button">
        <span><div class="tmh-name">${m.nombre}</div><div class="tmh-count">${m.items.length} lecciones</div></span>
        <span class="tmh-arrow">▾</span>
      </button>
      <div class="tm-body"><ol>${m.items.map(it => `<li>${it}</li>`).join('')}</ol></div>
    </div>
  `).join('');
  document.querySelectorAll('.tm-head').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.temario-modulo').classList.toggle('open'));
  });
}

function itemDelProducto() {
  if (producto.tipo === 'variantes') {
    return { slug, nombre: `${producto.nombre} (${varianteActual.nombre})`, precio: varianteActual.precio, precioUsd: varianteActual.precioUsd };
  }
  return { slug, nombre: producto.nombre, precio: producto.precio, precioUsd: producto.precioUsd };
}
function agregarAlCarrito() {
  const carrito = getCarrito().filter(i => i.slug !== slug);
  carrito.push(itemDelProducto());
  setCarrito(carrito);
  const fb = document.getElementById('cartFb');
  fb.textContent = `✓ ${producto.nombre} agregado al carrito`;
  setTimeout(() => { fb.textContent = ''; }, 2500);
}
function comprarAhora() {
  const carrito = getCarrito().filter(i => i.slug !== slug);
  carrito.push(itemDelProducto());
  setCarrito(carrito);
  window.location.href = '/carrito.html';
}

async function cargarResenas() {
  const wrap = document.getElementById('reviewsWrap');
  const ratingText = document.getElementById('ratingText');
  try {
    const r = await fetch(`${CORE_API}/api/curso/${slug}/testimonios-publicos`);
    if (!r.ok) throw new Error('sin endpoint');
    const lista = await r.json();
    if (!Array.isArray(lista) || !lista.length) throw new Error('vacío');
    wrap.innerHTML = lista.map(t => `
      <div class="review-card">
        <div class="rc-stars">${'★'.repeat(t.stars || 5)}</div>
        <div class="rc-text">${t.texto || ''}</div>
        <div class="rc-name">${t.nombre || 'Alumna/o COSMART'}</div>
      </div>
    `).join('');
    ratingText.textContent = `${lista.length} ${lista.length === 1 ? 'reseña' : 'reseñas'}`;
  } catch (e) {
    wrap.innerHTML = `<div class="reviews-empty">Este producto todavía no tiene reseñas.<br>Si lo comprás, vas a poder dejar la tuya al terminar cada módulo.</div>`;
    ratingText.textContent = 'Recién lanzado — todavía no tiene reseñas';
  }
}

// El upsell suma automáticamente cualquier producto nuevo del catálogo
// dinámico (creado desde el panel admin), no solo los 3 fijos -- así un
// e-book que agregues mañana ya aparece como sugerido sin tocar código.
// No hay todavía un sistema de "más parecido a lo que estás viendo" (no
// tenemos categorías ni historial de qué mira cada visitante) -- por ahora
// se muestran los demás productos activos del catálogo, hasta 3.
async function renderUpsell() {
  let dinamicos = [];
  try {
    const r = await fetch(`${CORE_API}/api/productos`);
    const d = await r.json();
    dinamicos = (d.productos || []).map(p => ({ slug: p.slug, nombre: p.nombre, desc: p.descripcion || '', precio: p.precio }));
  } catch (e) {}

  const vistos = new Set();
  const relacionados = [...UPSELL_BASE, ...dinamicos]
    .filter(p => p.slug !== slug && !vistos.has(p.slug) && vistos.add(p.slug))
    .slice(0, 3);

  document.getElementById('upsellGrid').innerHTML = relacionados.map(p => `
    <div class="upsell-card">
      <h3>${p.nombre}</h3>
      <p>${p.desc}</p>
      <div class="up-price">${formatoARS(p.precio)}</div>
      <a href="/${TIENDA_PREFIX}/${p.slug}">Ver más →</a>
    </div>
  `).join('');
}

// Igual que en tienda.html: los productos dinámicos ya vienen con el %
// aplicado desde el worker. Los del PRODUCT_DB de acá arriba están
// hardcodeados en esta página, se les aplica el mismo % acá mismo.
function aplicarPromoAProducto(p, promo) {
  const baseArs = p.precioTachado || p.precio;
  const baseUsd = p.precioUsdTachado || p.precioUsd;
  const factor = 1 - (promo.porcentaje || 0) / 100;
  p.precioTachado = baseArs;
  p.precio = Math.round(baseArs * factor);
  if (baseUsd) {
    p.precioUsdTachado = baseUsd;
    p.precioUsd = Math.round(baseUsd * factor * 100) / 100;
  }
}
async function aplicarPromoSiCorresponde(producto) {
  try {
    const r = await fetch(`${CORE_API}/api/promocion`);
    const promo = await r.json();
    if (!promo || !promo.activa) return;
    if (producto.tipo === 'variantes') producto.variantes.forEach(v => aplicarPromoAProducto(v, promo));
    else aplicarPromoAProducto(producto, promo);
  } catch (e) {}
}

async function init() {
  const m = /^\/(tienda-v2|tienda)\/([^/]+)\/?$/.exec(location.pathname);
  if (!m) { notFound(); return; }
  TIENDA_PREFIX = m[1];
  slug = decodeURIComponent(m[2]);

  if (TIENDA_PREFIX === 'tienda-v2') {
    document.body.classList.add('v2');
    document.getElementById('headerLogo').setAttribute('href', '/tienda-v2.html');
    document.getElementById('headerBack').setAttribute('href', '/tienda-v2.html');
    try { localStorage.setItem('ct_origen_tienda', 'tienda-v2.html'); } catch (e) {}
  } else {
    try { localStorage.setItem('ct_origen_tienda', 'tienda.html'); } catch (e) {}
  }

  // Links de email (ej: premio por reseña, GRACIAS50) pueden traer un
  // código de descuento ya asociado en la URL (?codigo=). Se guarda acá
  // para que carrito.html lo aplique solo -- así la persona no tiene que
  // copiarlo ni tipearlo, sea que llegue por "Comprar ahora" o por
  // "Agregar al carrito".
  const codigoQ = (new URLSearchParams(location.search).get('codigo') || '').toUpperCase().trim();
  if (codigoQ) { try { localStorage.setItem('ct_codigo', codigoQ); } catch (e) {} }

  if (PRODUCT_DB[slug]) {
    producto = PRODUCT_DB[slug];
    await aplicarPromoSiCorresponde(producto);
    render();
    return;
  }

  try {
    const r = await fetch(`${CORE_API}/api/productos`);
    const d = await r.json();
    const p = (d.productos || []).find(x => x.slug === slug);
    if (!p) { notFound(); return; }
    producto = {
      tipo: 'simple',
      slug: p.slug, nombre: p.nombre, subpitch: p.descripcion, badge: p.badge || '📖 E-book',
      urgencia: p.urgencia, precio: p.precio, precioUsd: p.precioUsd,
      precioTachado: p.precioTachado, precioUsdTachado: p.precioUsdTachado,
      imagenUrl: p.imagenUrl,
      trustList: ['Entrega digital inmediata después de la compra', 'Acceso de por vida desde tu cuenta', 'Pago en pesos (Mercado Pago) o en dólares (PayPal)'],
      faq: [FAQ_DEVOLUCION, FAQ_PAGO],
    };
    render();
  } catch (e) {
    notFound();
  }
}

init();
